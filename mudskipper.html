<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>갯벌 망둥어 잡기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<link rel="stylesheet" href="arcade.css">
<style>#game{cursor:pointer}</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <canvas id="game" aria-label="갯벌 망둥어 잡기 게임 화면"></canvas>
    <button class="hud-btn" id="muteBtn" type="button" hidden>소리 끔</button>
    <button class="hud-btn" id="pauseBtn" type="button" hidden>일시정지</button>

    <section class="panel" id="titlePanel">
      <p class="eyebrow">썰물 갯벌 · 물때 45초</p>
      <h1>갯벌 망둥어 잡기</h1>
      <p class="lede">물이 빠진 갯벌 구멍에서 망둥어가 고개를 내밉니다. 밀물이 들어오기 전에 최대한 많이 잡으세요. 복어는 건드리면 점수가 깎입니다.</p>
      <dl class="keys">
        <dt>잡기</dt><dd>구멍을 클릭 · 탭</dd>
        <dt>키보드</dt><dd>숫자패드 7~9 / 4~6 / 1~3 또는 Q W E / A S D / Z X C</dd>
        <dt>정지</dt><dd>P · Esc</dd>
      </dl>
      <ul class="legend">
        <li><span style="background:#b08a6a">10</span>망둥어</li>
        <li><span style="background:#f5c45e">50</span>황금 망둥어</li>
        <li><span style="background:#6fd0a8">+3</span>소라 (3초 연장)</li>
        <li><span style="background:#f08a5d">−20</span>복어</li>
      </ul>
      <div class="row">
        <button class="btn" id="startBtn" type="button">갯벌로</button>
        <span class="best">최고 기록 <b id="bestTitle">0</b></span>
      </div>
    </section>

    <section class="panel" id="pausePanel" hidden>
      <p class="eyebrow">물때 멈춤</p>
      <h2>일시정지</h2>
      <div class="row"><button class="btn" id="resumeBtn" type="button">계속 잡기</button></div>
    </section>

    <section class="panel" id="overPanel" hidden>
      <p class="eyebrow" id="overCount">망둥어 0마리</p>
      <h2>밀물이 들어왔습니다</h2>
      <p class="big-score" id="overScore">0</p>
      <p class="best" id="overBest">최고 기록 <b>0</b></p>
      <div class="row"><button class="btn" id="retryBtn" type="button">다시 잡기</button></div>
    </section>
  </div>
</div>

<script src="arcade.js"></script>
<script>
(() => {
'use strict';
const A = Arcade, $ = A.$, clamp = A.clamp;
const W = 480, H = 720, TAU = Math.PI * 2, HUD = 42, ROUND = 45;
const V = A.makeStage(W, H), ctx = V.ctx, cv = V.cv;
const show = A.panels();
A.bindMute($('muteBtn'));
let hi = A.store.get('arcade-mud-hi', 0);

const HOLES = [];
for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) HOLES.push({ x: 92 + c * 148, y: 330 + r * 132, busy: null });
const KEYMAP = { '7': 0, '8': 1, '9': 2, '4': 3, '5': 4, '6': 5, '1': 6, '2': 7, '3': 8, q: 0, w: 1, e: 2, a: 3, s: 4, d: 5, z: 6, x: 7, c: 8 };
const KIND = {
  goby: { pts: 10, up: [0.75, 1.25] },
  gold: { pts: 50, up: [0.45, 0.6] },
  shell: { pts: 0, up: [0.6, 0.8] },
  puffer: { pts: -20, up: [0.9, 1.3] }
};

let state = 'title', time = 0, left = ROUND, score = 0, combo = 0, caught = 0, spawnT = 0, played = 0, shake = 0;
let mobs = [], fx = [], hammer = null;

/* ---------- flow ---------- */
function showPanel(name) { show(name); $('bestTitle').textContent = A.fmt(hi); }
function startGame() {
  A.initAudio();
  left = ROUND; score = 0; combo = 0; caught = 0; spawnT = 0.6; played = 0; mobs = []; fx = []; hammer = null;
  for (const h of HOLES) h.busy = null;
  state = 'play'; showPanel(null);
}
function togglePause() {
  if (state === 'play') { state = 'pause'; showPanel('pause'); }
  else if (state === 'pause') { state = 'play'; showPanel(null); A.initAudio(); }
}
function gameOver() {
  state = 'over';
  if (score > hi) { hi = score; A.store.set('arcade-mud-hi', hi); }
  $('overScore').textContent = A.fmt(score);
  $('overCount').textContent = `망둥어 ${caught}마리 잡음`;
  $('overBest').innerHTML = `최고 기록 <b>${A.fmt(hi)}</b>`;
  showPanel('over');
}

/* ---------- spawning ---------- */
function pickKind() {
  const r = Math.random();
  if (r < 0.07) return 'gold';
  if (r < 0.11 && played > 8) return 'shell';
  if (r < 0.11 + Math.min(0.24, 0.1 + played * 0.004)) return 'puffer';
  return 'goby';
}
function spawn() {
  const free = HOLES.map((h, i) => i).filter(i => !HOLES[i].busy);
  if (!free.length) return;
  const i = free[Math.floor(Math.random() * free.length)], kind = pickKind(), k = KIND[kind];
  const speedUp = 1 - Math.min(0.4, played / 110);
  const m = { hole: i, kind, t: 0, up: (k.up[0] + Math.random() * (k.up[1] - k.up[0])) * speedUp, h: 0, phase: 'rise', hit: 0 };
  HOLES[i].busy = m; mobs.push(m);
}

/* ---------- input ---------- */
function whack(i) {
  if (state !== 'play') return;
  const hole = HOLES[i], m = hole.busy;
  hammer = { x: hole.x + 26, y: hole.y - 40, t: 0 };
  if (!m || m.phase === 'hit' || m.h < 0.35) {
    if (combo >= 3) popText(hole.x, hole.y - 60, '연속 끊김', '#b9adc8');
    combo = 0; A.noise(0.12, 0.08, 500); splash(hole.x, hole.y, 4);
    return;
  }
  m.phase = 'hit'; m.hit = 0;
  if (m.kind === 'puffer') {
    score = Math.max(0, score + KIND.puffer.pts); combo = 0; shake = 10;
    popText(hole.x, hole.y - 70, '−20', '#f08a5d');
    A.tone(140, 0.3, 'sawtooth', 0.08, 0.5);
    return;
  }
  if (m.kind === 'shell') {
    left = Math.min(ROUND + 15, left + 3);
    popText(hole.x, hole.y - 70, '+3초', '#6fd0a8');
    A.seq([660, 880, 1100], 50, 'triangle', 0.05);
    return;
  }
  combo++; caught++;
  const mult = Math.min(5, 1 + Math.floor(combo / 5));
  const pts = KIND[m.kind].pts * mult;
  score += pts;
  popText(hole.x, hole.y - 70, mult > 1 ? `+${pts} ×${mult}` : `+${pts}`, m.kind === 'gold' ? '#f5c45e' : '#f6ead7');
  splash(hole.x, hole.y, m.kind === 'gold' ? 12 : 7);
  if (m.kind === 'gold') A.seq([784, 988, 1318], 55, 'triangle', 0.06);
  else A.tone(520 + Math.min(combo, 15) * 30, 0.08, 'square', 0.05);
  shake = Math.max(shake, 3);
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (e.repeat) return;
  if (k === 'p' || k === 'escape') { togglePause(); return; }
  if (k === 'enter' && (state === 'title' || state === 'over')) { startGame(); return; }
  if (k in KEYMAP && state === 'play') { e.preventDefault(); whack(KEYMAP[k]); }
});
addEventListener('blur', () => { if (state === 'play') togglePause(); });
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  const p = V.toLocal(e);
  let best = -1, bd = 1e9;
  HOLES.forEach((h, i) => {
    const dx = p.x - h.x, dy = p.y - (h.y - 30);
    if (Math.abs(dx) < 72 && dy > -90 && dy < 60) { const d = dx * dx + dy * dy; if (d < bd) { bd = d; best = i; } }
  });
  if (best >= 0) whack(best);
});
$('startBtn').addEventListener('click', startGame);
$('retryBtn').addEventListener('click', startGame);
$('resumeBtn').addEventListener('click', togglePause);
$('pauseBtn').addEventListener('click', togglePause);

/* ---------- update ---------- */
function update(dt) {
  time += dt; shake = Math.max(0, shake - dt * 25);
  left -= dt;
  if (left <= 0) { left = 0; A.seq([523, 440, 349], 120, 'triangle', 0.06, 0.2); gameOver(); return; }
  spawnT -= dt;
  const busy = HOLES.filter(h => h.busy).length, cap = Math.min(4, 1 + Math.floor(played / 14));
  if (spawnT <= 0 && busy < cap) {
    spawn(); played++;
    spawnT = Math.max(0.28, 0.85 - played * 0.008) * (0.7 + Math.random() * 0.6);
  }
  for (const m of mobs) {
    m.t += dt;
    if (m.phase === 'rise') { m.h = Math.min(1, m.h + dt / 0.11); if (m.h >= 1) { m.phase = 'up'; m.t = 0; } }
    else if (m.phase === 'up') { if (m.t >= m.up) m.phase = 'fall'; }
    else if (m.phase === 'fall') {
      m.h = Math.max(0, m.h - dt / 0.12);
      if (m.h <= 0) {
        m.done = true;
        if (m.kind === 'goby' || m.kind === 'gold') { if (combo >= 3) popText(HOLES[m.hole].x, HOLES[m.hole].y - 50, '놓침', '#b9adc8'); combo = 0; }
      }
    } else if (m.phase === 'hit') { m.hit += dt; m.h = Math.max(0, 1 - Math.max(0, m.hit - 0.18) / 0.15); if (m.hit > 0.36) m.done = true; }
  }
  for (const m of mobs) if (m.done) HOLES[m.hole].busy = null;
  mobs = mobs.filter(m => !m.done);
  updFx(dt);
}
function updFx(dt) {
  for (const f of fx) { f.life += dt; f.x += f.vx * dt; f.y += f.vy * dt; if (f.k === 'mud') f.vy += 600 * dt; }
  fx = fx.filter(f => f.life < f.max);
  if (hammer) { hammer.t += dt; if (hammer.t > 0.18) hammer = null; }
}
let demoT = 0;
function ambient(dt) {
  time += dt; shake = Math.max(0, shake - dt * 25); updFx(dt);
  // title screen: gobies peek out on their own
  demoT -= dt;
  if (demoT <= 0) { demoT = 0.7; const free = HOLES.filter(h => !h.busy); if (free.length && mobs.length < 3) { const h = free[Math.floor(Math.random() * free.length)]; const m = { hole: HOLES.indexOf(h), kind: Math.random() < 0.15 ? 'gold' : 'goby', t: 0, up: 1, h: 0, phase: 'rise', hit: 0 }; h.busy = m; mobs.push(m); } }
  for (const m of mobs) {
    m.t += dt;
    if (m.phase === 'rise') { m.h = Math.min(1, m.h + dt / 0.2); if (m.h >= 1) { m.phase = 'up'; m.t = 0; } }
    else if (m.phase === 'up') { if (m.t > m.up) m.phase = 'fall'; }
    else { m.h = Math.max(0, m.h - dt / 0.2); if (m.h <= 0) m.done = true; }
  }
  for (const m of mobs) if (m.done) HOLES[m.hole].busy = null;
  mobs = mobs.filter(m => !m.done);
}
function popText(x, y, s, col) { fx.push({ k: 'text', x, y, vx: 0, vy: -50, life: 0, max: 0.8, s, col }); }
function splash(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2, s = 120 + Math.random() * 160;
    fx.push({ k: 'mud', x, y: y - 4, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0, max: 0.5 + Math.random() * 0.3, r: 2 + Math.random() * 3 });
  }
}

/* ---------- drawing ---------- */
let skyG = null, mudG = null;
function drawBg() {
  if (!skyG) {
    skyG = ctx.createLinearGradient(0, 0, 0, 200);
    skyG.addColorStop(0, '#3a2550'); skyG.addColorStop(0.7, '#c4624f'); skyG.addColorStop(1, '#f5b06a');
    mudG = ctx.createLinearGradient(0, 200, 0, H);
    mudG.addColorStop(0, '#6e4d55'); mudG.addColorStop(0.4, '#5a3d48'); mudG.addColorStop(1, '#3a2838');
  }
  ctx.fillStyle = skyG; ctx.fillRect(-20, -20, W + 40, 220);
  ctx.fillStyle = 'rgba(252,214,140,.9)'; ctx.beginPath(); ctx.arc(W * 0.68, 196, 40, Math.PI, TAU); ctx.fill();
  // tide line: the sea creeps closer as time runs out
  const frac = state === 'play' || state === 'pause' || state === 'over' ? 1 - clamp(left / ROUND, 0, 1) : 0;
  const seaY = 200 + frac * 90;
  ctx.fillStyle = mudG; ctx.fillRect(-20, 200, W + 40, H - 180);
  ctx.fillStyle = '#4b3a66'; ctx.fillRect(-20, 196, W + 40, seaY - 196);
  ctx.strokeStyle = 'rgba(252,214,140,.55)'; ctx.lineWidth = 2; ctx.beginPath();
  for (let i = 0; i < 9; i++) { const x = (i * 61 + time * 14) % (W + 40) - 20; ctx.moveTo(x, 204 + (i % 3) * 6); ctx.lineTo(x + 22, 204 + (i % 3) * 6); }
  ctx.stroke();
  ctx.fillStyle = 'rgba(246,234,215,.5)'; ctx.beginPath();
  for (let x = -20; x <= W + 20; x += 20) ctx.lineTo(x, seaY + Math.sin(x * 0.05 + time * 2) * 3);
  ctx.lineTo(W + 20, seaY + 5); ctx.lineTo(-20, seaY + 5); ctx.fill();
  // glossy puddles reflecting the sky
  ctx.fillStyle = 'rgba(240,138,93,.16)';
  for (const [x, y, w] of [[60, 268, 70], [300, 250, 110], [420, 690, 60], [200, 700, 90], [40, 600, 40]]) { ctx.beginPath(); ctx.ellipse(x, y, w, 7, 0, 0, TAU); ctx.fill(); }
}
function drawHoleBack(h) {
  ctx.fillStyle = '#7a5a60'; ctx.beginPath(); ctx.ellipse(h.x, h.y + 2, 62, 22, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#21151f'; ctx.beginPath(); ctx.ellipse(h.x, h.y, 50, 15, 0, 0, TAU); ctx.fill();
}
function drawHoleFront(h) {
  ctx.fillStyle = '#5a3d48'; ctx.beginPath(); ctx.ellipse(h.x, h.y + 4, 64, 16, 0, 0, Math.PI); ctx.fill();
  ctx.strokeStyle = 'rgba(246,234,215,.12)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(h.x, h.y + 2, 60, 18, 0, 0.15, Math.PI - 0.15); ctx.stroke();
}
function drawMob(m) {
  const h = HOLES[m.hole], rise = m.h * 70, hit = m.phase === 'hit';
  ctx.save();
  ctx.beginPath(); ctx.rect(h.x - 70, h.y - 140, 140, 140); ctx.ellipse(h.x, h.y, 50, 15, 0, 0, Math.PI); ctx.clip();
  ctx.translate(h.x, h.y + 46 - rise);
  if (hit) ctx.scale(1.12, 0.82);
  if (m.kind === 'goby' || m.kind === 'gold') {
    const body = m.kind === 'gold' ? '#f5c45e' : '#9c7a62', dark = m.kind === 'gold' ? '#c48d2c' : '#6e5444';
    ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, 0, 28, 46, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = dark; for (const [x, y] of [[-12, 4], [8, 14], [-4, 24], [14, -6]]) { ctx.beginPath(); ctx.arc(x, y, 3, 0, TAU); ctx.fill(); }
    ctx.fillStyle = m.kind === 'gold' ? '#ffe7a8' : '#cdb39a'; ctx.beginPath(); ctx.ellipse(0, 18, 16, 26, 0, 0, TAU); ctx.fill();
    // dorsal fin
    ctx.fillStyle = dark; ctx.beginPath(); ctx.moveTo(-6, -40); ctx.quadraticCurveTo(0, -60, 10, -42); ctx.closePath(); ctx.fill();
    // bulging eyes on top of the head
    for (const s of [-1, 1]) {
      ctx.fillStyle = body; ctx.beginPath(); ctx.arc(s * 13, -36, 11, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff6e6'; ctx.beginPath(); ctx.arc(s * 13, -37, 8, 0, TAU); ctx.fill();
      ctx.fillStyle = '#120d22';
      if (hit) { ctx.lineWidth = 2; ctx.strokeStyle = '#120d22'; ctx.beginPath(); ctx.moveTo(s * 13 - 4, -41); ctx.lineTo(s * 13 + 4, -33); ctx.moveTo(s * 13 + 4, -41); ctx.lineTo(s * 13 - 4, -33); ctx.stroke(); }
      else { ctx.beginPath(); ctx.arc(s * 13 + Math.sin(time * 3) * 2, -36, 3.6, 0, TAU); ctx.fill(); }
    }
    ctx.strokeStyle = '#4a3328'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, -16, 9, 0.2, Math.PI - 0.2); ctx.stroke();
    // pectoral fins like little arms
    ctx.fillStyle = dark;
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * 28, 4, 8, 5, s * (0.6 + Math.sin(time * 10) * 0.2), 0, TAU); ctx.fill(); }
    if (m.kind === 'gold') { ctx.fillStyle = `rgba(255,246,220,${0.6 + 0.4 * Math.sin(time * 12)})`; ctx.beginPath(); ctx.arc(20, -50, 3, 0, TAU); ctx.arc(-22, -20, 2, 0, TAU); ctx.fill(); }
  } else if (m.kind === 'puffer') {
    ctx.translate(0, -10);
    ctx.fillStyle = '#e8b04a';
    ctx.beginPath(); for (let i = 0; i < 18; i++) { const a = i / 18 * TAU, r = i % 2 ? 36 : 44; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.fill();
    ctx.fillStyle = '#f5cf6e'; ctx.beginPath(); ctx.arc(0, 0, 34, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f6ead7'; ctx.beginPath(); ctx.ellipse(0, 14, 24, 16, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#8a5a2b'; for (const [x, y] of [[-14, -16], [0, -22], [14, -16]]) { ctx.beginPath(); ctx.arc(x, y, 3, 0, TAU); ctx.fill(); }
    for (const s of [-1, 1]) { ctx.fillStyle = '#fff6e6'; ctx.beginPath(); ctx.arc(s * 13, -4, 7, 0, TAU); ctx.fill(); ctx.fillStyle = '#120d22'; ctx.beginPath(); ctx.arc(s * 12, -3, 3.2, 0, TAU); ctx.fill(); }
    ctx.strokeStyle = '#120d22'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-14, -14); ctx.lineTo(-6, -10); ctx.moveTo(14, -14); ctx.lineTo(6, -10); ctx.stroke();
    ctx.fillStyle = '#c4624f'; ctx.beginPath(); ctx.ellipse(0, 10, 5, 4, 0, 0, TAU); ctx.fill();
  } else {
    // spiral shell that adds time
    ctx.translate(0, -12);
    ctx.fillStyle = '#6fd0a8'; ctx.beginPath(); ctx.moveTo(-30, 30); ctx.quadraticCurveTo(-36, -24, 0, -38); ctx.quadraticCurveTo(34, -24, 30, 30); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#2f7a62'; ctx.lineWidth = 3; ctx.beginPath();
    for (let i = 0; i < 40; i++) { const a = i * 0.45, r = 2 + i * 0.6; ctx.lineTo(Math.cos(a) * r, -6 + Math.sin(a) * r * 0.9); }
    ctx.stroke();
    ctx.fillStyle = '#f6ead7'; ctx.font = '700 15px "Chakra Petch", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('+3', 0, 20);
  }
  ctx.restore();
}
function drawHammer() {
  if (!hammer) return;
  const a = -0.9 + Math.min(1, hammer.t / 0.08) * 1.3;
  ctx.save(); ctx.translate(hammer.x + 40, hammer.y + 40); ctx.rotate(a);
  ctx.fillStyle = '#8a5a2b'; ctx.fillRect(-4, -10, 8, 70);
  ctx.fillStyle = '#d9a35a'; ctx.fillRect(-26, -30, 52, 26);
  ctx.fillStyle = 'rgba(246,234,215,.45)'; ctx.fillRect(-24, -28, 48, 4);
  ctx.restore();
}
function drawFx() {
  for (const f of fx) {
    const a = 1 - f.life / f.max;
    if (f.k === 'mud') { ctx.fillStyle = `rgba(58,40,56,${a})`; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TAU); ctx.fill(); }
    else { ctx.globalAlpha = a; ctx.fillStyle = f.col || '#f6ead7'; ctx.font = '700 18px "Chakra Petch", "IBM Plex Sans KR", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(f.s, f.x, f.y); ctx.globalAlpha = 1; }
  }
}
function drawHUD() {
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(18,13,34,.6)'; ctx.fillRect(0, 0, W, HUD);
  ctx.font = '600 10px "IBM Plex Sans KR", sans-serif'; ctx.fillStyle = '#b9adc8';
  ctx.textAlign = 'left'; ctx.fillText('점수', 14, 15);
  ctx.textAlign = 'center'; ctx.fillText('남은 물때', W / 2, 15);
  ctx.textAlign = 'right'; ctx.fillText('최고', W - 14, 15);
  ctx.font = '700 19px "Chakra Petch", monospace';
  ctx.textAlign = 'left'; ctx.fillStyle = '#f6ead7'; ctx.fillText(String(score).padStart(5, '0'), 14, 35);
  ctx.textAlign = 'center'; ctx.fillStyle = left < 10 ? '#f08a5d' : '#f6ead7'; ctx.fillText(`${left.toFixed(1)}초`, W / 2, 35);
  ctx.textAlign = 'right'; ctx.fillStyle = '#f5c45e'; ctx.fillText(String(Math.max(hi, score)).padStart(5, '0'), W - 14, 35);
  // time bar
  ctx.fillStyle = 'rgba(18,13,34,.5)'; ctx.fillRect(0, HUD, W, 5);
  ctx.fillStyle = left < 10 ? '#f08a5d' : '#6fd0a8'; ctx.fillRect(0, HUD, W * clamp(left / ROUND, 0, 1), 5);
  if (combo >= 2) {
    const mult = Math.min(5, 1 + Math.floor(combo / 5));
    ctx.textAlign = 'center'; ctx.font = '26px "Black Han Sans", "IBM Plex Sans KR", sans-serif'; ctx.fillStyle = '#f5c45e';
    ctx.fillText(`${combo} 연속${mult > 1 ? ` · 점수 ×${mult}` : ''}`, W / 2, H - 22);
  }
}
function draw() {
  V.begin();
  ctx.save();
  if (shake > 0 && !A.reduceMotion) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBg();
  for (const h of HOLES) drawHoleBack(h);
  for (const m of mobs) drawMob(m);
  for (const h of HOLES) drawHoleFront(h);
  drawFx(); drawHammer();
  ctx.restore();
  if (state !== 'title') drawHUD();
}

showPanel('title');
A.loop(dt => {
  if (state === 'play') update(dt); else if (state !== 'pause') ambient(dt);
  draw();
});
})();
</script>
</body>
</html>
