<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>바다 뱀장어</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<link rel="stylesheet" href="arcade.css">
</head>
<body>
<div id="stage">
  <div id="frame">
    <canvas id="game" aria-label="바다 뱀장어 게임 화면"></canvas>
    <button class="hud-btn" id="muteBtn" type="button" hidden>소리 끔</button>
    <button class="hud-btn" id="pauseBtn" type="button" hidden>일시정지</button>

    <section class="panel" id="titlePanel">
      <p class="eyebrow">등대 아래 바위틈 · 수심 12m</p>
      <h1>바다 뱀장어</h1>
      <p class="lede">배고픈 뱀장어가 저녁 물고기를 쫓습니다. 먹을수록 몸이 길어지고 빨라집니다. 벽, 바위, 자기 꼬리에 부딪히면 끝납니다.</p>
      <dl class="keys">
        <dt>방향</dt><dd>방향키 · WASD · 화면을 밀어서</dd>
        <dt>정지</dt><dd>P · Esc</dd>
      </dl>
      <ul class="legend">
        <li><span style="background:#f08a5d">10</span>노을 물고기</li>
        <li><span style="background:#f5c45e">50</span>황금 새우 (잠깐만 나옴)</li>
        <li><span style="background:#59627a"></span>바위 (물고기 4마리마다 생김)</li>
      </ul>
      <div class="row">
        <button class="btn" id="startBtn" type="button">헤엄치기</button>
        <span class="best">최고 기록 <b id="bestTitle">0</b></span>
      </div>
    </section>

    <section class="panel" id="pausePanel" hidden>
      <p class="eyebrow">바위틈에서 쉬는 중</p>
      <h2>일시정지</h2>
      <div class="row"><button class="btn" id="resumeBtn" type="button">계속하기</button></div>
    </section>

    <section class="panel" id="overPanel" hidden>
      <p class="eyebrow" id="overLen">길이 4칸</p>
      <h2 id="overWhy">벽에 부딪혔습니다</h2>
      <p class="big-score" id="overScore">0</p>
      <p class="best" id="overBest">최고 기록 <b>0</b></p>
      <div class="row"><button class="btn" id="retryBtn" type="button">다시 헤엄치기</button></div>
    </section>
  </div>
</div>

<script src="arcade.js"></script>
<script>
(() => {
'use strict';
const A = Arcade, $ = A.$, clamp = A.clamp;
const W = 480, H = 720, TAU = Math.PI * 2, HUD = 42;
const CELL = 24, COLS = 20, ROWS = 26, OX = 0, OY = 60;
const V = A.makeStage(W, H), ctx = V.ctx, cv = V.cv;
const show = A.panels();
A.bindMute($('muteBtn'));
let hi = A.store.get('arcade-eel-hi', 0);

const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
let state = 'title', body = [], prev = [], dir = 'right', queue = [], grow = 0, stepT = 0, interval = 0.15;
let fish = null, shrimp = null, rocks = [], eaten = 0, score = 0, time = 0, deadT = 0, why = '', fx = [], shake = 0;
const bubbles = Array.from({ length: 26 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: 1 + Math.random() * 3, s: 14 + Math.random() * 26 }));
const weeds = Array.from({ length: 9 }, (_, i) => ({ x: 20 + i * 55 + Math.random() * 20, h: 50 + Math.random() * 70, ph: Math.random() * 6 }));

/* ---------- flow ---------- */
function showPanel(name) { show(name); $('bestTitle').textContent = A.fmt(hi); }
function startGame() {
  A.initAudio();
  const cy = Math.floor(ROWS / 2);
  body = [[8, cy], [7, cy], [6, cy], [5, cy]]; prev = body.map(p => p.slice());
  dir = 'right'; queue = []; grow = 0; stepT = -0.5; eaten = 0; score = 0; rocks = []; shrimp = null; fx = []; deadT = 0;
  interval = 0.15; placeFish();
  state = 'play'; showPanel(null);
}
function togglePause() {
  if (state === 'play') { state = 'pause'; showPanel('pause'); }
  else if (state === 'pause') { state = 'play'; showPanel(null); A.initAudio(); }
}
function gameOver() {
  state = 'over';
  if (score > hi) { hi = score; A.store.set('arcade-eel-hi', hi); }
  $('overScore').textContent = A.fmt(score);
  $('overLen').textContent = `길이 ${body.length}칸 · 물고기 ${eaten}마리`;
  $('overWhy').textContent = why;
  $('overBest').innerHTML = `최고 기록 <b>${A.fmt(hi)}</b>`;
  showPanel('over');
}

/* ---------- grid helpers ---------- */
const same = (a, b) => a[0] === b[0] && a[1] === b[1];
function occupied(c) {
  return body.some(p => same(p, c)) || rocks.some(r => same(r, c)) || (fish && same(fish, c)) || (shrimp && same(shrimp, c));
}
function freeCell(avoidHead) {
  for (let tries = 0; tries < 400; tries++) {
    const c = [Math.floor(Math.random() * COLS), Math.floor(Math.random() * ROWS)];
    if (occupied(c)) continue;
    if (avoidHead && Math.abs(c[0] - body[0][0]) + Math.abs(c[1] - body[0][1]) < avoidHead) continue;
    return c;
  }
  return null;
}
function placeFish() { fish = freeCell(3); if (fish) fish.t = 0; }

/* ---------- input ---------- */
const KEYDIR = { arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down', arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right' };
const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
function turn(d) {
  if (state !== 'play') return;
  const lastD = queue.length ? queue[queue.length - 1] : dir;
  if (d === lastD || d === OPP[lastD] || queue.length >= 3) return;
  queue.push(d);
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (KEYDIR[k]) { e.preventDefault(); turn(KEYDIR[k]); }
  if (k === ' ') e.preventDefault();
  if (e.repeat) return;
  if (k === 'p' || k === 'escape') togglePause();
  if (k === 'enter' && (state === 'title' || state === 'over')) startGame();
});
addEventListener('blur', () => { if (state === 'play') togglePause(); });
let swipe = null;
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  swipe = { id: e.pointerId, x: e.clientX, y: e.clientY };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', e => {
  if (!swipe || swipe.id !== e.pointerId) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
  turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  swipe.x = e.clientX; swipe.y = e.clientY;
});
const endSwipe = () => { swipe = null; };
cv.addEventListener('pointerup', endSwipe); cv.addEventListener('pointercancel', endSwipe);
$('startBtn').addEventListener('click', startGame);
$('retryBtn').addEventListener('click', startGame);
$('resumeBtn').addEventListener('click', togglePause);
$('pauseBtn').addEventListener('click', togglePause);

/* ---------- update ---------- */
function die(reason) {
  why = reason; deadT = 1.2; shake = 10;
  A.tone(180, 0.5, 'sawtooth', 0.08, 0.3); A.noise(0.4, 0.15, 800);
  for (const p of body) burst(cx(p[0]), cy(p[1]), '#f08a5d', 3);
}
function step() {
  if (queue.length) dir = queue.shift();
  const [dx, dy] = DIRS[dir], h = body[0], nh = [h[0] + dx, h[1] + dy];
  if (nh[0] < 0 || nh[0] >= COLS || nh[1] < 0 || nh[1] >= ROWS) { die('벽에 부딪혔습니다'); return; }
  if (rocks.some(r => same(r, nh))) { die('바위에 부딪혔습니다'); return; }
  const tailMoves = grow === 0;
  const hitsSelf = body.some((p, i) => same(p, nh) && !(tailMoves && i === body.length - 1));
  if (hitsSelf) { die('꼬리를 물었습니다'); return; }
  prev = body.map(p => p.slice());
  body.unshift(nh);
  if (grow > 0) grow--; else body.pop();

  if (fish && same(nh, fish)) {
    eaten++; grow += 2;
    const pts = 10 * (1 + Math.floor(eaten / 8));
    score += pts; popText(cx(nh[0]), cy(nh[1]) - 14, '+' + pts);
    burst(cx(nh[0]), cy(nh[1]), '#f08a5d', 8);
    A.tone(660 + (eaten % 8) * 60, 0.08, 'triangle', 0.06);
    interval = Math.max(0.062, 0.15 - eaten * 0.0028);
    if (eaten % 4 === 0 && rocks.length < 28) { const r = freeCell(5); if (r) { rocks.push(r); r.t = 0; } }
    placeFish();
    if (!shrimp && Math.random() < 0.28) { shrimp = freeCell(4); if (shrimp) { shrimp.life = 6.5; shrimp.t = 0; } }
  }
  if (shrimp && same(nh, shrimp)) {
    score += 50; grow += 1; popText(cx(nh[0]), cy(nh[1]) - 14, '+50');
    burst(cx(nh[0]), cy(nh[1]), '#f5c45e', 12);
    A.seq([784, 988, 1175], 60, 'triangle', 0.06);
    shrimp = null;
  }
}
function update(dt) {
  time += dt; shake = Math.max(0, shake - dt * 25);
  ambient(dt, true);
  if (deadT > 0) { deadT -= dt; if (deadT <= 0) gameOver(); return; }
  if (fish) fish.t += dt;
  for (const r of rocks) r.t = (r.t || 0) + dt;
  if (shrimp) { shrimp.t += dt; shrimp.life -= dt; if (shrimp.life <= 0) shrimp = null; }
  stepT += dt;
  while (stepT >= interval && deadT <= 0) { stepT -= interval; step(); }
}
function ambient(dt, inPlay) {
  if (!inPlay) { time += dt; shake = Math.max(0, shake - dt * 25); }
  for (const b of bubbles) { b.y -= b.s * dt; b.x += Math.sin(time + b.s) * 6 * dt; if (b.y < -10) { b.y = H + 10; b.x = Math.random() * W; } }
  for (const f of fx) { f.life += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.94; f.vy *= 0.94; }
  fx = fx.filter(f => f.life < f.max);
}
function popText(x, y, s) { fx.push({ k: 'text', x, y, vx: 0, vy: -36, life: 0, max: 0.8, s }); }
function burst(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = 40 + Math.random() * 120;
    fx.push({ k: 'dot', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0, max: 0.4 + Math.random() * 0.4, col, r: 1.5 + Math.random() * 2.5 });
  }
}

/* ---------- drawing ---------- */
const cx = c => OX + c * CELL + CELL / 2, cy = r => OY + r * CELL + CELL / 2;
let waterGrad = null;
function drawBg() {
  if (!waterGrad) {
    waterGrad = ctx.createLinearGradient(0, 0, 0, H);
    waterGrad.addColorStop(0, '#2c4f6b'); waterGrad.addColorStop(0.35, '#163450'); waterGrad.addColorStop(1, '#0d1a2e');
  }
  ctx.fillStyle = waterGrad; ctx.fillRect(-20, -20, W + 40, H + 40);
  // sunset light shafts from the surface
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 4; i++) {
    const x = 60 + i * 120 + Math.sin(time * 0.3 + i) * 20;
    ctx.fillStyle = 'rgba(240,138,93,.045)';
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 50, 0); ctx.lineTo(x + 130, H); ctx.lineTo(x + 30, H); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // board
  ctx.fillStyle = 'rgba(8,16,30,.35)'; ctx.fillRect(OX, OY, COLS * CELL, ROWS * CELL);
  ctx.fillStyle = 'rgba(185,173,200,.09)';
  for (let c = 1; c < COLS; c++) for (let r = 1; r < ROWS; r++) ctx.fillRect(OX + c * CELL - 1, OY + r * CELL - 1, 2, 2);
  ctx.strokeStyle = 'rgba(245,196,94,.28)'; ctx.lineWidth = 2; ctx.strokeRect(OX + 1, OY + 1, COLS * CELL - 2, ROWS * CELL - 2);
  // seaweed along the floor
  for (const w of weeds) {
    ctx.strokeStyle = 'rgba(80,150,110,.45)'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath();
    const base = OY + ROWS * CELL;
    ctx.moveTo(w.x, base);
    for (let i = 1; i <= 6; i++) ctx.lineTo(w.x + Math.sin(time * 1.4 + w.ph + i * 0.7) * i * 2.2, base - w.h * i / 6);
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(214,234,240,.22)';
  for (const b of bubbles) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill(); }
}
function drawRock(r) {
  const x = cx(r[0]), y = cy(r[1]), s = Math.min(1, (r.t || 1) * 4);
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#3f4760'; ctx.beginPath();
  ctx.moveTo(-11, 6); ctx.lineTo(-9, -6); ctx.lineTo(-2, -11); ctx.lineTo(8, -8); ctx.lineTo(11, 3); ctx.lineTo(6, 10); ctx.lineTo(-6, 10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#5d6784'; ctx.beginPath(); ctx.moveTo(-8, -5); ctx.lineTo(-2, -9); ctx.lineTo(6, -6); ctx.lineTo(0, -2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(111,208,168,.5)'; ctx.fillRect(-6, 6, 4, 3); ctx.fillRect(3, 7, 3, 2);
  ctx.restore();
}
function drawFish(f) {
  const x = cx(f[0]), y = cy(f[1]) + Math.sin(f.t * 4) * 1.5, wag = Math.sin(f.t * 12) * 3;
  ctx.fillStyle = 'rgba(240,138,93,.18)'; ctx.beginPath(); ctx.arc(x, y, 13, 0, TAU); ctx.fill();
  ctx.fillStyle = '#f08a5d';
  ctx.beginPath(); ctx.moveTo(x + 5, y); ctx.lineTo(x + 12, y - 6 + wag); ctx.lineTo(x + 12, y + 6 + wag); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x - 1, y, 8, 5.5, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#f5c45e'; ctx.fillRect(x - 2, y - 5, 2, 10);
  ctx.fillStyle = '#120d22'; ctx.beginPath(); ctx.arc(x - 5, y - 1.5, 1.4, 0, TAU); ctx.fill();
}
function drawShrimp(s) {
  const x = cx(s[0]), y = cy(s[1]), blink = s.life < 2 && Math.floor(s.life * 8) % 2;
  if (blink) return;
  ctx.fillStyle = 'rgba(245,196,94,.25)'; ctx.beginPath(); ctx.arc(x, y, 14 + Math.sin(s.t * 6) * 2, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#f5c45e'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y + 2, 7, Math.PI * 1.1, Math.PI * 2.1); ctx.stroke();
  ctx.strokeStyle = '#ffe2a8'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x - 6, y - 2); ctx.quadraticCurveTo(x - 14, y - 12, x - 4, y - 14); ctx.stroke();
}
function eelPoints() {
  const a = state === 'play' && deadT <= 0 && stepT > 0 ? clamp(stepT / interval, 0, 1) : 1;
  return body.map((p, i) => {
    const q = prev[i] || prev[prev.length - 1] || p;
    return [cx(q[0] + (p[0] - q[0]) * a), cy(q[1] + (p[1] - q[1]) * a)];
  });
}
function drawEel() {
  if (!body.length) return;
  const pts = eelPoints(), n = pts.length;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // shadow
  ctx.strokeStyle = 'rgba(5,10,20,.35)'; ctx.lineWidth = 18; ctx.beginPath();
  pts.forEach(([x, y], i) => i ? ctx.lineTo(x + 3, y + 5) : ctx.moveTo(x + 3, y + 5)); ctx.stroke();
  // body, tapering toward the tail
  for (let i = n - 1; i > 0; i--) {
    const t = i / Math.max(1, n - 1);
    ctx.strokeStyle = deadT > 0 ? '#8a7f96' : `hsl(${28 - t * 22}, ${78 - t * 20}%, ${62 - t * 18}%)`;
    ctx.lineWidth = 18 - t * 8;
    ctx.beginPath(); ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(pts[i - 1][0], pts[i - 1][1]); ctx.stroke();
  }
  // dorsal stripe
  ctx.strokeStyle = 'rgba(58,37,80,.45)'; ctx.lineWidth = 3; ctx.beginPath();
  pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
  // head
  const [hx, hy] = pts[0], [ddx, ddy] = DIRS[dir];
  ctx.fillStyle = deadT > 0 ? '#8a7f96' : '#f5b45e';
  ctx.beginPath(); ctx.ellipse(hx + ddx * 3, hy + ddy * 3, 11, 11, 0, 0, TAU); ctx.fill();
  const ex = -ddy, ey = ddx;
  for (const s of [-1, 1]) {
    const px = hx + ddx * 5 + ex * 5 * s, py = hy + ddy * 5 + ey * 5 * s;
    ctx.fillStyle = '#fff6e6'; ctx.beginPath(); ctx.arc(px, py, 3.4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#120d22';
    if (deadT > 0) { ctx.fillRect(px - 2, py - 0.6, 4, 1.2); }
    else { ctx.beginPath(); ctx.arc(px + ddx * 1.2, py + ddy * 1.2, 1.7, 0, TAU); ctx.fill(); }
  }
}
function drawFx() {
  for (const f of fx) {
    const a = 1 - f.life / f.max;
    if (f.k === 'dot') { ctx.globalAlpha = a; ctx.fillStyle = f.col; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; }
    else { ctx.fillStyle = `rgba(246,234,215,${a})`; ctx.font = '700 13px "Chakra Petch", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(f.s, f.x, f.y); }
  }
}
function drawHUD() {
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(18,13,34,.6)'; ctx.fillRect(0, 0, W, HUD);
  ctx.font = '600 10px "IBM Plex Sans KR", sans-serif'; ctx.fillStyle = '#b9adc8';
  ctx.textAlign = 'left'; ctx.fillText('점수', 14, 15);
  ctx.textAlign = 'center'; ctx.fillText('길이', W / 2, 15);
  ctx.textAlign = 'right'; ctx.fillText('최고', W - 14, 15);
  ctx.font = '700 19px "Chakra Petch", monospace';
  ctx.textAlign = 'left'; ctx.fillStyle = '#f6ead7'; ctx.fillText(String(score).padStart(6, '0'), 14, 35);
  ctx.textAlign = 'center'; ctx.fillText(`${body.length}칸`, W / 2, 35);
  ctx.textAlign = 'right'; ctx.fillStyle = '#f5c45e'; ctx.fillText(String(Math.max(hi, score)).padStart(6, '0'), W - 14, 35);
  const by = OY + ROWS * CELL + 22;
  ctx.font = '600 11px "IBM Plex Sans KR", sans-serif'; ctx.fillStyle = '#b9adc8'; ctx.textAlign = 'left';
  ctx.fillText(`물고기 ${eaten}마리 · 바위 ${rocks.length}개`, 14, by);
  ctx.textAlign = 'right';
  const spd = Math.round((0.15 / interval) * 10) / 10;
  ctx.fillText(`속도 ×${spd.toFixed(1)}`, W - 14, by);
  if (state === 'play' && stepT < 0) {
    ctx.textAlign = 'center'; ctx.font = '36px "Black Han Sans", "IBM Plex Sans KR", sans-serif'; ctx.fillStyle = '#f6ead7';
    ctx.fillText('준비', W / 2, OY + ROWS * CELL * 0.32);
  }
}
let demoT = 0;
function demoEel() {
  // title screen: an eel drifting in a slow loop
  demoT += 0.016;
  const pts = [];
  for (let i = 0; i < 14; i++) { const t = demoT * 1.2 - i * 0.18; pts.push([W / 2 + Math.cos(t) * 130, 240 + Math.sin(t * 2) * 60]); }
  ctx.lineCap = 'round';
  for (let i = pts.length - 1; i > 0; i--) {
    const t = i / (pts.length - 1);
    ctx.strokeStyle = `hsl(${28 - t * 22}, ${78 - t * 20}%, ${62 - t * 18}%)`; ctx.lineWidth = 18 - t * 8;
    ctx.beginPath(); ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(pts[i - 1][0], pts[i - 1][1]); ctx.stroke();
  }
  ctx.fillStyle = '#f5b45e'; ctx.beginPath(); ctx.arc(pts[0][0], pts[0][1], 11, 0, TAU); ctx.fill();
}
function draw() {
  V.begin();
  ctx.save();
  if (shake > 0 && !A.reduceMotion) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBg();
  if (state === 'title') demoEel();
  else {
    for (const r of rocks) drawRock(r);
    if (fish) drawFish(fish);
    if (shrimp) drawShrimp(shrimp);
    drawEel();
  }
  drawFx();
  ctx.restore();
  if (state !== 'title') drawHUD();
}

showPanel('title');
A.loop(dt => {
  if (state === 'play') update(dt); else if (state !== 'pause') ambient(dt, false);
  draw();
});
})();
</script>
</body>
</html>
