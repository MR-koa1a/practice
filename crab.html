<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>꽃게 질주</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<link rel="stylesheet" href="arcade.css">
</head>
<body>
<div id="stage">
  <div id="frame">
    <canvas id="game" aria-label="꽃게 질주 게임 화면"></canvas>
    <button class="hud-btn" id="muteBtn" type="button" hidden>소리 끔</button>
    <button class="hud-btn" id="pauseBtn" type="button" hidden>일시정지</button>

    <section class="panel" id="titlePanel">
      <p class="eyebrow">서쪽 모래사장 · 해 질 무렵</p>
      <h1>꽃게 질주</h1>
      <p class="lede">밀물이 오기 전에 꽃게가 집으로 달려갑니다. 바위와 유목, 낮게 나는 갈매기는 뛰어넘고, 높이 나는 갈매기 밑으로는 뛰지 말고 지나가세요. 해가 지면 점점 빨라집니다.</p>
      <dl class="keys">
        <dt>점프</dt><dd>스페이스 · ↑ · 클릭 · 탭 (길게 누르면 높이, 공중에서 한 번 더)</dd>
        <dt>급강하</dt><dd>↓ · S</dd>
        <dt>정지</dt><dd>P · Esc</dd>
      </dl>
      <ul class="legend">
        <li><span style="background:#f6ead7">25</span>조개껍데기</li>
        <li><span style="background:#f5c45e">1</span>달린 거리 1m마다</li>
      </ul>
      <div class="row">
        <button class="btn" id="startBtn" type="button">달리기</button>
        <span class="best">최고 기록 <b id="bestTitle">0</b></span>
      </div>
    </section>

    <section class="panel" id="pausePanel" hidden>
      <p class="eyebrow">모래 속에 숨는 중</p>
      <h2>일시정지</h2>
      <div class="row"><button class="btn" id="resumeBtn" type="button">계속 달리기</button></div>
    </section>

    <section class="panel" id="overPanel" hidden>
      <p class="eyebrow" id="overDist">0m 달림</p>
      <h2 id="overWhy">바위에 걸렸습니다</h2>
      <p class="big-score" id="overScore">0</p>
      <p class="best" id="overBest">최고 기록 <b>0</b></p>
      <div class="row"><button class="btn" id="retryBtn" type="button">다시 달리기</button></div>
    </section>
  </div>
</div>

<script src="arcade.js"></script>
<script>
(() => {
'use strict';
const A = Arcade, $ = A.$, clamp = A.clamp;
const W = 480, H = 720, TAU = Math.PI * 2, HUD = 42;
const GY = 560, CRAB_X = 110, CW = 50, CH = 30;
const V = A.makeStage(W, H), ctx = V.ctx, cv = V.cv;
const show = A.panels();
A.bindMute($('muteBtn'));
let hi = A.store.get('arcade-crab-hi', 0);

let state = 'title', time = 0, run = 0, speed = 320, dist = 0, shells = 0, score = 0, nextGap = 400, shake = 0;
let crab, obs = [], items = [], fx = [], why = '', deadT = 0;
const far = Array.from({ length: 5 }, (_, i) => ({ x: i * 170 + Math.random() * 60, w: 120 + Math.random() * 120, h: 30 + Math.random() * 40 }));
const stars = Array.from({ length: 60 }, () => ({ x: Math.random() * W, y: HUD + Math.random() * 300, r: Math.random() * 1.4 + 0.4, p: Math.random() * 6 }));
const pebbles = Array.from({ length: 40 }, () => ({ x: Math.random() * W, y: GY + 8 + Math.random() * (H - GY - 20), r: 1 + Math.random() * 2.5 }));
let held = false;

/* ---------- flow ---------- */
function showPanel(name) { show(name); $('bestTitle').textContent = A.fmt(hi); }
function startGame() {
  A.initAudio();
  crab = { y: GY, vy: 0, ground: true, jumps: 0, hold: 0, leg: 0, flip: 0 };
  obs = []; items = []; fx = []; run = 0; speed = 320; dist = 0; shells = 0; score = 0; nextGap = 520; deadT = 0;
  state = 'play'; showPanel(null);
}
function togglePause() {
  if (state === 'play') { state = 'pause'; held = false; showPanel('pause'); }
  else if (state === 'pause') { state = 'play'; showPanel(null); A.initAudio(); }
}
function gameOver() {
  state = 'over';
  if (score > hi) { hi = score; A.store.set('arcade-crab-hi', hi); }
  $('overScore').textContent = A.fmt(score);
  $('overDist').textContent = `${A.fmt(dist / 10)}m 달림 · 조개 ${shells}개`;
  $('overWhy').textContent = why;
  $('overBest').innerHTML = `최고 기록 <b>${A.fmt(hi)}</b>`;
  showPanel('over');
}

/* ---------- input ---------- */
function press() {
  if (state !== 'play' || deadT > 0) return;
  held = true;
  if (crab.ground) { crab.vy = -860; crab.ground = false; crab.jumps = 1; crab.hold = 0.2; A.tone(420, 0.12, 'square', 0.04, 1.8); puff(CRAB_X, GY, 6); }
  else if (crab.jumps < 2) { crab.vy = -720; crab.jumps = 2; crab.hold = 0.12; A.tone(620, 0.1, 'square', 0.04, 1.6); puff(CRAB_X, crab.y, 5); }
}
function release() { held = false; }
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ([' ', 'arrowup', 'arrowdown'].includes(k)) e.preventDefault();
  if (k === 'arrowdown' || k === 's') { if (crab && !crab.ground && state === 'play') crab.vy = Math.max(crab.vy, 900); }
  if (e.repeat) return;
  if (k === ' ' || k === 'arrowup' || k === 'w') press();
  if (k === 'p' || k === 'escape') togglePause();
  if (k === 'enter' && (state === 'title' || state === 'over')) startGame();
});
addEventListener('keyup', e => { const k = e.key.toLowerCase(); if (k === ' ' || k === 'arrowup' || k === 'w') release(); });
addEventListener('blur', () => { held = false; if (state === 'play') togglePause(); });
cv.addEventListener('pointerdown', e => { press(); try { cv.setPointerCapture(e.pointerId); } catch (err) {} });
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);
$('startBtn').addEventListener('click', startGame);
$('retryBtn').addEventListener('click', startGame);
$('resumeBtn').addEventListener('click', togglePause);
$('pauseBtn').addEventListener('click', togglePause);

/* ---------- spawning ---------- */
function spawn() {
  const x = W + 40, r = Math.random(), lv = Math.min(1, run / 70);
  if (r < 0.32) obs.push({ k: 'rock', x, w: 34, h: 30 });
  else if (r < 0.5) obs.push({ k: 'rock', x, w: 44, h: 50 });
  else if (r < 0.62 + lv * 0.05) { obs.push({ k: 'rock', x, w: 32, h: 28 }); obs.push({ k: 'rock', x: x + 40, w: 34, h: 36 }); }
  else if (r < 0.76) obs.push({ k: 'log', x, w: 92, h: 24 });
  else if (r < 0.88) obs.push({ k: 'gull', x, w: 46, h: 22, y: GY - 22, low: true, t: Math.random() * 6 });
  else obs.push({ k: 'gull', x, w: 46, h: 22, y: GY - 112, low: false, t: Math.random() * 6 });
  // shells: an arc above the obstacle, or a low line on the sand
  if (Math.random() < 0.55) {
    const arc = Math.random() < 0.6, n = 4;
    for (let i = 0; i < n; i++) {
      const sx = x - 30 + i * 34, sy = arc ? GY - 70 - Math.sin(i / (n - 1) * Math.PI) * 70 : GY - 16;
      items.push({ x: arc ? sx : sx + 200, y: sy, t: Math.random() * 6 });
    }
  }
  nextGap = (speed * 0.75 + 190) * (0.8 + Math.random() * 0.6);
}
function hitBox(o) {
  if (o.k === 'gull') return { x: o.x - o.w / 2 + 6, y: o.y - o.h / 2 + 4, w: o.w - 12, h: o.h - 8 };
  return { x: o.x - o.w / 2 + 4, y: GY - o.h + 4, w: o.w - 8, h: o.h - 4 };
}

/* ---------- update ---------- */
function update(dt) {
  time += dt; shake = Math.max(0, shake - dt * 25);
  if (deadT > 0) {
    deadT -= dt; crab.vy += 1800 * dt; crab.y = Math.min(GY, crab.y + crab.vy * dt); crab.flip = Math.min(1, crab.flip + dt * 4);
    updFx(dt);
    if (deadT <= 0) gameOver();
    return;
  }
  run += dt;
  speed = Math.min(780, 320 + run * 7.5);
  const dx = speed * dt;
  dist += dx; score = Math.floor(dist / 10) + shells * 25;

  // crab physics
  const c = crab;
  let g = 2700;
  if (held && c.vy < 0 && c.hold > 0) { g *= 0.45; c.hold -= dt; }
  c.vy += g * dt; c.y += c.vy * dt;
  if (c.y >= GY) {
    if (!c.ground) { puff(CRAB_X, GY, 4); A.tone(160, 0.05, 'triangle', 0.03); }
    c.y = GY; c.vy = 0; c.ground = true; c.jumps = 0;
  }
  c.leg += dt * (c.ground ? speed / 22 : 4);

  // world
  for (const o of obs) { o.x -= dx + (o.k === 'gull' ? 70 * dt : 0); if (o.t !== undefined) o.t += dt; }
  obs = obs.filter(o => o.x > -120);
  for (const it of items) { it.x -= dx; it.t += dt; }
  items = items.filter(it => it.x > -30 && !it.taken);
  nextGap -= dx;
  if (nextGap <= 0) spawn();
  for (const f of far) { f.x -= dx * 0.12; if (f.x + f.w < 0) { f.x += 5 * 170; f.w = 120 + Math.random() * 120; f.h = 30 + Math.random() * 40; } }
  for (const p of pebbles) { p.x -= dx; if (p.x < -5) { p.x += W + 10; p.y = GY + 8 + Math.random() * (H - GY - 20); } }

  // collisions
  const cb = { x: CRAB_X - CW / 2 + 7, y: c.y - CH + 6, w: CW - 14, h: CH - 6 };
  for (const o of obs) {
    const b = hitBox(o);
    if (cb.x < b.x + b.w && cb.x + cb.w > b.x && cb.y < b.y + b.h && cb.y + cb.h > b.y) {
      why = o.k === 'gull' ? '갈매기와 부딪혔습니다' : o.k === 'log' ? '유목에 걸렸습니다' : '바위에 걸렸습니다';
      deadT = 1.1; c.vy = -520; shake = 12; held = false;
      A.tone(200, 0.45, 'sawtooth', 0.08, 0.35); A.noise(0.3, 0.15, 900);
      stars3(CRAB_X, c.y - 20);
      return;
    }
  }
  for (const it of items) {
    if (Math.abs(it.x - CRAB_X) < 26 && Math.abs(it.y - (c.y - CH / 2)) < 28) {
      it.taken = true; shells++;
      popText(it.x, it.y - 12, '+25');
      A.tone(1046 + (shells % 5) * 80, 0.07, 'triangle', 0.05);
    }
  }
  updFx(dt);
}
function updFx(dt) {
  for (const f of fx) { f.life += dt; f.x += f.vx * dt; f.y += f.vy * dt; if (f.k === 'puff') f.vx -= speed * 0.6 * dt; }
  fx = fx.filter(f => f.life < f.max);
}
function ambient(dt) {
  time += dt; shake = Math.max(0, shake - dt * 25);
  for (const f of far) { f.x -= 20 * dt; if (f.x + f.w < 0) f.x += 5 * 170; }
  for (const p of pebbles) { p.x -= 40 * dt; if (p.x < -5) p.x += W + 10; }
  updFx(dt);
}
function puff(x, y, n) {
  for (let i = 0; i < n; i++) fx.push({ k: 'puff', x: x + (Math.random() - 0.5) * 30, y: y - 3, vx: -30 - Math.random() * 40, vy: -20 - Math.random() * 40, life: 0, max: 0.35 + Math.random() * 0.2, r: 3 + Math.random() * 4 });
}
function stars3(x, y) { for (let i = 0; i < 3; i++) fx.push({ k: 'star', x, y, vx: (i - 1) * 60, vy: -80, life: 0, max: 1, r: 6 }); }
function popText(x, y, s) { fx.push({ k: 'text', x, y, vx: 0, vy: -40, life: 0, max: 0.7, s }); }

/* ---------- drawing ---------- */
function mix(a, b, t) { return a.map((v, i) => Math.round(v + (b[i] - v) * t)); }
function rgb(c, a) { return a === undefined ? `rgb(${c[0]},${c[1]},${c[2]})` : `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
const SKY = { top: [[72, 52, 110], [18, 14, 40]], mid: [[232, 128, 96], [52, 34, 82]], low: [[250, 196, 120], [96, 54, 96]] };
function drawSky(night) {
  const g = ctx.createLinearGradient(0, 0, 0, GY);
  g.addColorStop(0, rgb(mix(SKY.top[0], SKY.top[1], night)));
  g.addColorStop(0.62, rgb(mix(SKY.mid[0], SKY.mid[1], night)));
  g.addColorStop(1, rgb(mix(SKY.low[0], SKY.low[1], night)));
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, GY + 20);
  if (night > 0.3) for (const s of stars) {
    ctx.fillStyle = `rgba(246,234,215,${(night - 0.3) * (0.5 + 0.5 * Math.sin(time * 2 + s.p))})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
  }
  // sun sinks into the sea as the run goes on, the moon rises
  const sunY = 330 + night * 170;
  ctx.fillStyle = `rgba(250,206,130,${0.25 * (1 - night)})`; ctx.beginPath(); ctx.arc(330, sunY, 90, 0, TAU); ctx.fill();
  ctx.fillStyle = rgb(mix([252, 214, 140], [240, 120, 90], night)); ctx.beginPath(); ctx.arc(330, sunY, 48, 0, TAU); ctx.fill();
  if (night > 0.4) {
    const my = 200 - (night - 0.4) * 120;
    ctx.fillStyle = `rgba(246,234,215,${(night - 0.4) * 1.6})`; ctx.beginPath(); ctx.arc(90, my, 20, 0, TAU); ctx.fill();
    ctx.fillStyle = rgb(mix(SKY.top[0], SKY.top[1], night)); ctx.beginPath(); ctx.arc(98, my - 5, 17, 0, TAU); ctx.fill();
  }
  // far islands
  ctx.fillStyle = rgb(mix([120, 70, 110], [34, 24, 58], night));
  for (const f of far) { ctx.beginPath(); ctx.ellipse(f.x + f.w / 2, 470, f.w / 2, f.h, 0, Math.PI, TAU); ctx.fill(); }
  // sea band
  ctx.fillStyle = rgb(mix([90, 70, 130], [26, 22, 54], night)); ctx.fillRect(0, 470, W, GY - 470);
  ctx.strokeStyle = rgb(mix([252, 214, 140], [140, 120, 180], night), 0.45); ctx.lineWidth = 2; ctx.beginPath();
  for (let i = 0; i < 12; i++) {
    const x = ((i * 53 - time * 30) % (W + 60) + W + 60) % (W + 60) - 30, y = 482 + (i % 5) * 14;
    ctx.moveTo(x, y); ctx.lineTo(x + 16 + (i % 3) * 10, y);
  }
  ctx.stroke();
}
function drawSand(night) {
  ctx.fillStyle = rgb(mix([226, 184, 132], [92, 70, 82], night)); ctx.fillRect(0, GY, W, H - GY);
  ctx.fillStyle = rgb(mix([246, 220, 170], [130, 110, 120], night)); ctx.fillRect(0, GY, W, 4);
  ctx.fillStyle = rgb(mix([186, 140, 96], [66, 50, 66], night));
  for (const p of pebbles) { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); }
  // wet sand line, the tide is coming
  const wet = 6 + Math.sin(time * 1.2) * 4;
  ctx.fillStyle = rgb(mix([150, 110, 110], [40, 30, 60], night), 0.5); ctx.fillRect(0, GY + 4, W, wet);
}
function drawObs(o, night) {
  if (o.k === 'rock') {
    const x = o.x - o.w / 2, y = GY - o.h;
    ctx.fillStyle = rgb(mix([92, 82, 110], [44, 38, 64], night));
    ctx.beginPath(); ctx.moveTo(x, GY); ctx.lineTo(x + 3, y + o.h * 0.35); ctx.lineTo(x + o.w * 0.35, y); ctx.lineTo(x + o.w * 0.75, y + 3); ctx.lineTo(x + o.w, y + o.h * 0.45); ctx.lineTo(x + o.w, GY); ctx.closePath(); ctx.fill();
    ctx.fillStyle = rgb(mix([140, 126, 150], [70, 62, 92], night));
    ctx.beginPath(); ctx.moveTo(x + 5, y + o.h * 0.35); ctx.lineTo(x + o.w * 0.35, y + 2); ctx.lineTo(x + o.w * 0.55, y + o.h * 0.3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(111,208,168,.55)'; ctx.fillRect(x + 4, GY - 6, o.w * 0.4, 3);
  } else if (o.k === 'log') {
    const x = o.x - o.w / 2, y = GY - o.h;
    ctx.fillStyle = rgb(mix([150, 104, 70], [70, 50, 50], night)); ctx.beginPath();
    ctx.moveTo(x + 10, y); ctx.lineTo(x + o.w - 10, y); ctx.quadraticCurveTo(x + o.w, y + o.h / 2, x + o.w - 10, GY); ctx.lineTo(x + 10, GY); ctx.quadraticCurveTo(x, y + o.h / 2, x + 10, y); ctx.fill();
    ctx.fillStyle = rgb(mix([200, 160, 116], [100, 80, 80], night)); ctx.beginPath(); ctx.ellipse(x + o.w - 10, y + o.h / 2, 6, o.h / 2 - 2, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgb(mix([110, 74, 50], [50, 36, 40], night)); ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(x + 14, y + 7); ctx.lineTo(x + o.w - 26, y + 7); ctx.moveTo(x + 20, y + 15); ctx.lineTo(x + o.w - 30, y + 15); ctx.stroke();
  } else {
    const flap = Math.sin(o.t * 12) * 9;
    ctx.save(); ctx.translate(o.x, o.y);
    ctx.fillStyle = 'rgba(18,13,34,.18)'; ctx.beginPath(); ctx.ellipse(0, GY - o.y + 3, 16, 3, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgb(mix([246, 234, 215], [190, 180, 200], night)); ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath();
    ctx.moveTo(-22, -flap); ctx.quadraticCurveTo(-10, -4 - flap * 0.3, 0, 0); ctx.quadraticCurveTo(10, -4 - flap * 0.3, 22, -flap); ctx.stroke();
    ctx.fillStyle = rgb(mix([246, 234, 215], [190, 180, 200], night)); ctx.beginPath(); ctx.ellipse(0, 2, 11, 5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f5c45e'; ctx.beginPath(); ctx.moveTo(-11, 1); ctx.lineTo(-18, 3); ctx.lineTo(-11, 4); ctx.fill();
    ctx.fillStyle = '#120d22'; ctx.beginPath(); ctx.arc(-7, 0, 1.3, 0, TAU); ctx.fill();
    ctx.restore();
  }
}
function drawShell(it) {
  const y = it.y + Math.sin(it.t * 4) * 3;
  ctx.fillStyle = 'rgba(246,234,215,.25)'; ctx.beginPath(); ctx.arc(it.x, y, 12, 0, TAU); ctx.fill();
  ctx.fillStyle = '#f6ead7'; ctx.beginPath(); ctx.moveTo(it.x - 9, y + 5); ctx.quadraticCurveTo(it.x, y - 14, it.x + 9, y + 5); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#d99a7a'; ctx.lineWidth = 1.2; ctx.beginPath();
  for (const a of [-6, -2, 2, 6]) { ctx.moveTo(it.x, y + 4); ctx.lineTo(it.x + a, y - 4); }
  ctx.stroke();
  ctx.fillStyle = '#e8b49a'; ctx.fillRect(it.x - 3, y + 4, 6, 3);
}
function drawCrab(x, y, c) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(18,13,34,.25)'; ctx.beginPath(); ctx.ellipse(0, GY - y + 2, 24 * (1 - Math.min(0.5, (GY - y) / 300)), 4, 0, 0, TAU); ctx.fill();
  if (c.flip) { ctx.translate(0, -CH / 2); ctx.rotate(c.flip * Math.PI); ctx.translate(0, CH / 2); }
  const air = !c.ground;
  // legs
  ctx.strokeStyle = '#b8402e'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (const s of [-1, 1]) for (let i = 0; i < 3; i++) {
    const ph = c.leg + i * 1.9 + (s > 0 ? Math.PI : 0), lift = air ? 4 : Math.max(0, Math.sin(ph)) * 5;
    const bx = s * (8 + i * 5), kx = s * (17 + i * 5), fy = air ? -2 : 0;
    ctx.beginPath(); ctx.moveTo(bx, -10); ctx.lineTo(kx, -14 - lift); ctx.lineTo(kx + s * 4, fy - lift * 0.4); ctx.stroke();
  }
  // shell
  ctx.fillStyle = '#e0553c'; ctx.beginPath(); ctx.ellipse(0, -15, 21, 12, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#f08a5d'; ctx.beginPath(); ctx.ellipse(-3, -19, 13, 5, -0.1, 0, TAU); ctx.fill();
  ctx.fillStyle = '#b8402e'; for (const sx of [-10, 0, 10]) { ctx.beginPath(); ctx.arc(sx, -8, 1.6, 0, TAU); ctx.fill(); }
  // claws, raised while jumping
  for (const s of [-1, 1]) {
    const up = air ? -10 : Math.sin(c.leg * 0.5 + s) * 2;
    ctx.strokeStyle = '#d24a34'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(s * 14, -20); ctx.lineTo(s * 22, -30 + up); ctx.stroke();
    ctx.fillStyle = '#e0553c'; ctx.beginPath(); ctx.ellipse(s * 25, -34 + up, 7, 6, s * 0.5, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#f6ead7'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(s * 25, -34 + up); ctx.lineTo(s * 31, -38 + up); ctx.stroke();
  }
  // eye stalks
  for (const s of [-1, 1]) {
    ctx.strokeStyle = '#b8402e'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(s * 6, -25); ctx.lineTo(s * 7, -33); ctx.stroke();
    ctx.fillStyle = '#fff6e6'; ctx.beginPath(); ctx.arc(s * 7, -35, 3.6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#120d22'; ctx.beginPath(); ctx.arc(s * 7 + 1, -35, 1.8, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
function drawFx() {
  for (const f of fx) {
    const a = 1 - f.life / f.max;
    if (f.k === 'puff') { ctx.fillStyle = `rgba(246,226,190,${a * 0.6})`; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1 + f.life * 2), 0, TAU); ctx.fill(); }
    else if (f.k === 'star') {
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.life * 6); ctx.fillStyle = `rgba(245,196,94,${a})`; ctx.beginPath();
      for (let i = 0; i < 10; i++) { const r = i % 2 ? 2.5 : 6, an = i / 10 * TAU; ctx.lineTo(Math.cos(an) * r, Math.sin(an) * r); }
      ctx.fill(); ctx.restore();
    } else { ctx.fillStyle = `rgba(246,234,215,${a})`; ctx.font = '700 13px "Chakra Petch", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(f.s, f.x, f.y); }
  }
}
function drawHUD() {
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(18,13,34,.55)'; ctx.fillRect(0, 0, W, HUD);
  ctx.font = '600 10px "IBM Plex Sans KR", sans-serif'; ctx.fillStyle = '#b9adc8';
  ctx.textAlign = 'left'; ctx.fillText('점수', 14, 15);
  ctx.textAlign = 'center'; ctx.fillText('거리', W / 2, 15);
  ctx.textAlign = 'right'; ctx.fillText('최고', W - 14, 15);
  ctx.font = '700 19px "Chakra Petch", monospace';
  ctx.textAlign = 'left'; ctx.fillStyle = '#f6ead7'; ctx.fillText(String(score).padStart(6, '0'), 14, 35);
  ctx.textAlign = 'center'; ctx.fillText(`${A.fmt(dist / 10)}m`, W / 2, 35);
  ctx.textAlign = 'right'; ctx.fillStyle = '#f5c45e'; ctx.fillText(String(Math.max(hi, score)).padStart(6, '0'), W - 14, 35);
  ctx.font = '600 11px "IBM Plex Sans KR", sans-serif'; ctx.fillStyle = 'rgba(246,234,215,.8)'; ctx.textAlign = 'left';
  ctx.fillText(`조개 ${shells}개 · 시속 ${Math.round(speed / 10 * 3.6)}km`, 14, H - 18);
}
function draw() {
  V.begin();
  const night = state === 'title' ? 0.1 : clamp(run / 100, 0, 1);
  ctx.save();
  if (shake > 0 && !A.reduceMotion) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawSky(night); drawSand(night);
  for (const it of items) drawShell(it);
  for (const o of obs) drawObs(o, night);
  if (crab) drawCrab(CRAB_X, crab.y, crab);
  else drawCrab(CRAB_X + 30, GY, { ground: true, leg: time * 8, flip: 0 });
  drawFx();
  ctx.restore();
  if (state !== 'title') drawHUD();
}

showPanel('title');
A.loop(dt => {
  if (state === 'play') update(dt); else if (state !== 'pause') ambient(dt);
  draw();
});
})();
</script>
