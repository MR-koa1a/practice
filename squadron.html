<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>노을 편대</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: one full-height stage holding a 2:3 portrait flight canvas; menus are HTML panels laid over it, anchored low and left like a flight briefing card. Single dusk theme by choice. */
:root{
  --dusk:#1b1530;      /* page ground, evening sky */
  --plum:#3a2550;      /* panel tint */
  --coral:#f08a5d;     /* sunset light, warnings */
  --brass:#f5c45e;     /* primary action, player tracer */
  --cream:#f6ead7;     /* text */
  --mist:#b9adc8;      /* secondary text, plum-biased neutral */
  --ink:#120d22;
  --f-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,sans-serif;
  --f-num:"Chakra Petch","IBM Plex Sans KR",ui-monospace,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--dusk);color:var(--cream);font-family:var(--f-body);
  overflow:hidden;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
#stage{height:100%;display:grid;place-items:center}
#frame{position:relative;user-select:none;-webkit-user-select:none;touch-action:none;box-shadow:0 0 0 1px rgba(245,196,94,.18),0 30px 80px rgba(0,0,0,.45);max-width:100%}
#game{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.panel{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:18px;
  padding:28px 28px 40px;box-sizing:border-box;
  background:linear-gradient(to bottom,rgba(27,21,48,.1) 0%,rgba(27,21,48,.55) 45%,rgba(18,13,34,.92) 100%);
}
.eyebrow{font-family:var(--f-num);font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--coral);margin:0}
.panel h1,.panel h2{font-family:var(--f-display);font-weight:400;margin:0;line-height:1;text-wrap:balance}
.panel h1{font-size:clamp(52px,14vmin,84px);color:var(--cream);text-shadow:0 4px 0 var(--coral)}
.panel h2{font-size:clamp(36px,9vmin,54px)}
.lede{margin:0;max-width:30ch;line-height:1.6;color:var(--mist);font-size:15px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13px;color:var(--mist)}
.keys dt{font-family:var(--f-num);font-weight:700;color:var(--cream);letter-spacing:.04em}
.keys dd{margin:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.btn{
  font-family:var(--f-display);font-size:22px;letter-spacing:.04em;
  background:var(--brass);color:var(--ink);border:0;border-radius:3px;padding:12px 30px;cursor:pointer;
  box-shadow:0 4px 0 #b9862a;transition:transform .08s ease,box-shadow .08s ease;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 #b9862a}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b9862a}
.btn:focus-visible,.hud-btn:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.best{font-family:var(--f-num);font-size:14px;color:var(--mist);font-variant-numeric:tabular-nums}
.best b{color:var(--brass);font-weight:700}
.big-score{font-family:var(--f-num);font-weight:700;font-size:44px;color:var(--brass);font-variant-numeric:tabular-nums;margin:0;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mist);margin:0;padding:0;list-style:none}
.legend span{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-family:var(--f-num);font-weight:700;font-size:11px;color:var(--ink);margin-right:5px}
.hud-btn{
  position:absolute;font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--cream);
  background:rgba(18,13,34,.45);border:1px solid rgba(246,234,215,.25);border-radius:3px;padding:5px 9px;cursor:pointer;
}
#pauseBtn{top:52px;right:12px}
#muteBtn{top:52px;right:76px}
#bombBtn{
  bottom:14px;right:14px;width:66px;height:66px;border-radius:50%;padding:0;
  display:grid;place-items:center;align-content:center;gap:0;line-height:1.1;
  border:2px solid var(--coral);background:rgba(58,37,80,.6);
}
#bombBtn b{font-family:var(--f-num);font-size:20px;color:var(--coral)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
html.embedded body{padding-left:0;padding-right:0}
</style>
<script>try{if(window.self!==window.top)document.documentElement.classList.add("embedded")}catch(e){document.documentElement.classList.add("embedded")}</script>
</head>
<body>

<div id="stage">
  <div id="frame">
    <canvas id="game" aria-label="노을 편대 게임 화면"></canvas>

    <button class="hud-btn" id="muteBtn" type="button" hidden>소리 끔</button>
    <button class="hud-btn" id="pauseBtn" type="button" hidden>일시정지</button>
    <button class="hud-btn" id="bombBtn" type="button" hidden>폭탄<b>2</b></button>

    <section class="panel" id="titlePanel">
      <p class="eyebrow">남쪽 군도 · 일몰 초계</p>
      <h1>노을 편대</h1>
      <p class="lede">해가 지는 바다 위, 마지막으로 남은 정찰기 한 대가 몰려오는 적 편대를 막아섭니다. 다섯 번째 파마다 적 기함 흑운호가 나타납니다.</p>
      <dl class="keys">
        <dt>이동</dt><dd>방향키 · WASD · 화면을 끌어서 조종</dd>
        <dt>사격</dt><dd>자동</dd>
        <dt>폭탄</dt><dd>X · B · 오른쪽 아래 버튼 (화면의 적 탄 제거)</dd>
        <dt>정지</dt><dd>P · Esc</dd>
      </dl>
      <ul class="legend">
        <li><span style="background:#f5c45e">P</span>화력 강화</li>
        <li><span style="background:#6fd0a8">H</span>기체 수리</li>
        <li><span style="background:#f08a5d">B</span>폭탄 보급</li>
      </ul>
      <div class="row">
        <button class="btn" id="startBtn" type="button">출격</button>
        <span class="best">최고 기록 <b id="bestTitle">0</b></span>
      </div>
    </section>

    <section class="panel" id="pausePanel" hidden>
      <p class="eyebrow">무전 대기</p>
      <h2>일시정지</h2>
      <div class="row">
        <button class="btn" id="resumeBtn" type="button">계속 비행</button>
      </div>
    </section>

    <section class="panel" id="overPanel" hidden>
      <p class="eyebrow" id="overWave">제 1 파에서 격추</p>
      <h2>격추되었습니다</h2>
      <p class="big-score" id="overScore">0</p>
      <p class="best" id="overBest">최고 기록 <b>0</b></p>
      <div class="row">
        <button class="btn" id="retryBtn" type="button">다시 출격</button>
      </div>
    </section>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 480, H = 720, TAU = Math.PI * 2;
const SH = 'rgba(8,18,34,.28)';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage'), frame = document.getElementById('frame');
const $ = id => document.getElementById(id);
const panels = { title: $('titlePanel'), pause: $('pausePanel'), over: $('overPanel') };
const bombBtn = $('bombBtn'), pauseBtn = $('pauseBtn'), muteBtn = $('muteBtn');

let scale = 1, dpr = 1;
function fit() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  let h = sh, w = h * 2 / 3;
  if (w > sw) { w = sw; h = w * 1.5; }
  frame.style.width = w + 'px'; frame.style.height = h + 'px';
  scale = w / W; dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
}
addEventListener('resize', fit); fit();

/* ---------- storage ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let hi = store.get('noeul-hi', 0);
let muted = store.get('noeul-mute', false);

/* ---------- audio ---------- */
let ac = null, noiseBuf = null;
function initAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  if (ac && ac.state === 'suspended') ac.resume();
}
function tone(freq, dur, type, vol, slide) {
  if (!ac || muted) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
  g.gain.setValueAtTime(vol || 0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, lp) {
  if (!ac || muted) return;
  if (!noiseBuf) {
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass';
  f.frequency.setValueAtTime(lp, t); f.frequency.exponentialRampToValueAtTime(60, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(ac.destination); s.start(t); s.stop(t + dur);
}
let boomCount = 0;
const sfx = {
  shoot() { tone(900, 0.045, 'square', 0.012, 0.5); },
  hit() { tone(240, 0.05, 'square', 0.02, 0.6); },
  boom(big) { if (boomCount > 4) return; boomCount++; setTimeout(() => boomCount--, 80); noise(big ? 1.1 : 0.45, big ? 0.38 : 0.16, big ? 900 : 1700); },
  power() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.09, 'triangle', 0.06), i * 60)); },
  hurt() { tone(170, 0.35, 'sawtooth', 0.08, 0.3); noise(0.3, 0.2, 700); },
  bomb() { noise(1.4, 0.42, 2600); tone(90, 1.0, 'sine', 0.22, 0.4); },
  alarm() { [0, 380, 760].forEach(d => setTimeout(() => tone(620, 0.26, 'triangle', 0.06, 0.7), d)); }
};

/* ---------- input ---------- */
const keys = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  keys[k] = true;
  if (e.repeat) return;
  if (k === 'p' || k === 'escape') togglePause();
  if (k === 'x' || k === 'b') useBomb();
  if (k === 'm') toggleMute();
  if (k === 'enter' && (state === 'title' || state === 'over')) startGame();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') togglePause(); });

let drag = null;
cv.addEventListener('pointerdown', e => {
  if (state !== 'play' || !P || P.dead) return;
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId || !P) return;
  const k = 1.3 / scale;
  P.x += (e.clientX - drag.x) * k; P.y += (e.clientY - drag.y) * k;
  drag.x = e.clientX; drag.y = e.clientY; clampPlayer();
});
const endDrag = e => { if (drag && drag.id === e.pointerId) drag = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

$('startBtn').addEventListener('click', startGame);
$('retryBtn').addEventListener('click', startGame);
$('resumeBtn').addEventListener('click', togglePause);
pauseBtn.addEventListener('click', togglePause);
muteBtn.addEventListener('click', toggleMute);
bombBtn.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); useBomb(); });

function toggleMute() { muted = !muted; store.set('noeul-mute', muted); muteBtn.textContent = muted ? '소리 켬' : '소리 끔'; }
muteBtn.textContent = muted ? '소리 켬' : '소리 끔';

/* ---------- state ---------- */
let state = 'title', P = null;
let pb = [], eb = [], en = [], pu = [], fx = [];
let score = 0, wave = 0, waveT = 0, clearT = 0, spawnQ = [], boss = null;
let shake = 0, flash = 0, time = 0, bossCount = 0, banner = null, shotTick = 0;

function showPanel(name) {
  for (const k in panels) panels[k].hidden = k !== name;
  const inGame = name === null || name === 'pause';
  bombBtn.hidden = pauseBtn.hidden = muteBtn.hidden = !inGame;
  $('bestTitle').textContent = hi.toLocaleString('ko-KR');
}

function startGame() {
  initAudio();
  P = { x: W / 2, y: H - 110, px: W / 2, r: 6, hp: 3, maxHp: 5, inv: 2, power: 1, bombs: 2, fireT: 0, bank: 0, dead: false, deadT: 0 };
  pb = []; eb = []; en = []; pu = []; fx = [];
  score = 0; wave = 0; boss = null; shake = 0; flash = 0; time = 0; bossCount = 0; clearT = 0;
  nextWave(); state = 'play'; showPanel(null); syncBomb();
  last = performance.now();
}

function togglePause() {
  if (state === 'play') { state = 'pause'; drag = null; showPanel('pause'); }
  else if (state === 'pause') { state = 'play'; showPanel(null); last = performance.now(); initAudio(); }
}

function gameOver() {
  state = 'over';
  if (score > hi) { hi = score; store.set('noeul-hi', hi); }
  en = []; eb = []; pu = []; boss = null;
  $('overScore').textContent = score.toLocaleString('ko-KR');
  $('overWave').textContent = `제 ${wave} 파에서 격추`;
  $('overBest').innerHTML = `최고 기록 <b>${hi.toLocaleString('ko-KR')}</b>`;
  showPanel('over');
}

function syncBomb() { if (P) bombBtn.querySelector('b').textContent = P.bombs; }

/* ---------- waves ---------- */
const SUBS = ['해안선 상공', '적 정찰대 포착', '구름 아래 순찰', '남쪽 군도 상공', '저녁 바람을 타고', '등대 너머', '마지막 햇빛'];
function nextWave() {
  wave++; waveT = 0; clearT = 0; spawnQ = [];
  if (wave % 5 === 0) {
    banner = { text: '경고 · 적 기함 접근', sub: `제 ${wave} 파 · 흑운호`, t: 3.2, warn: true };
    sfx.alarm();
    spawnQ.push({ at: 2.6, fn: spawnBoss });
  } else {
    banner = { text: `제 ${wave} 파`, sub: SUBS[(wave - 1) % SUBS.length], t: 2.4 };
    let t = 1.8; const n = 5 + Math.floor(wave * 1.2);
    for (let i = 0; i < n; i++) {
      spawnQ.push({ at: t, fn: pickFormation() });
      t += Math.max(1.0, 2.6 - wave * 0.12) + Math.random() * 0.8;
    }
  }
}
function pickFormation() {
  const list = [
    [fColumn, 3], [fV, 2.5], [fGunPair, wave >= 2 ? 2 : 0.8], [fGunSingle, 1.2],
    [fSweep, wave >= 2 ? 2 : 0], [fBomber, wave >= 3 ? 1.2 : 0], [fKami, wave >= 3 ? 1.5 : 0]
  ];
  let sum = 0; for (const [, w] of list) sum += w;
  let r = Math.random() * sum;
  for (const [f, w] of list) { r -= w; if (r <= 0) return f; }
  return fColumn;
}
function fColumn() {
  const x = 60 + Math.random() * (W - 120), amp = 30 + Math.random() * 60, ph = Math.random() * 6;
  for (let i = 0; i < 5; i++) addEnemy('scout', x, -30 - i * 42, { amp, ph: ph - i * 0.9, bx: x });
}
function fV() {
  const x = 90 + Math.random() * (W - 180), ph = Math.random() * 6;
  [[0, 0], [-36, -32], [36, -32], [-72, -64], [72, -64]].forEach(([dx, dy]) =>
    addEnemy('scout', x + dx, -30 + dy, { amp: 18, ph, bx: x + dx }));
}
function fSweep() {
  const left = Math.random() < 0.5, y = 30 + Math.random() * 90;
  for (let i = 0; i < 6; i++)
    addEnemy('scout', left ? -30 - i * 38 : W + 30 + i * 38, y, { mode: 'arc', vx: left ? 175 : -175 });
}
function fGunPair() {
  const ty = 100 + Math.random() * 90;
  addEnemy('gunship', W * 0.27, -40, { ty, bx: W * 0.27, dir: 1 });
  addEnemy('gunship', W * 0.73, -40, { ty, bx: W * 0.73, dir: -1 });
}
function fGunSingle() {
  const x = 80 + Math.random() * (W - 160);
  addEnemy('gunship', x, -40, { ty: 90 + Math.random() * 130, bx: x, dir: Math.random() < 0.5 ? 1 : -1 });
}
function fBomber() { const x = 100 + Math.random() * (W - 200); addEnemy('bomber', x, -60, { bx: x }); }
function fKami() { [60, W / 2, W - 60].forEach((x, i) => addEnemy('kamikaze', x, -30 - i * 40)); }

const ET = {
  scout: { hp: 2, r: 14, score: 100, drop: 0.05 },
  gunship: { hp: 9, r: 20, score: 300, drop: 0.18 },
  bomber: { hp: 32, r: 34, score: 800, drop: 0.7 },
  kamikaze: { hp: 3, r: 13, score: 200, drop: 0.05 }
};
function addEnemy(type, x, y, o) {
  const d = ET[type];
  en.push(Object.assign({
    type, x, y, t: 0, hp: Math.ceil(d.hp * (1 + (wave - 1) * 0.08)), r: d.r, score: d.score, drop: d.drop,
    fireT: 1 + Math.random() * 1.2, hitT: 0, ang: Math.PI, bx: x, ph: 0, amp: 0, sp: 0
  }, o || {}));
}

/* ---------- bullets ---------- */
const bulletSpd = () => Math.min(270, 165 + wave * 6);
function shot(x, y, a, s) { eb.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 5 }); }
function aimShot(e, off) { const a = Math.atan2(P.y - e.y, P.x - e.x) + off; shot(e.x, e.y + 10, a, bulletSpd()); }
function fan(x, y, n, spread, s) {
  const c = Math.atan2(P.y - y, P.x - x);
  for (let i = 0; i < n; i++) shot(x, y, c + (n === 1 ? 0 : (i / (n - 1) - 0.5) * spread), s);
}
function ring(x, y, n, off, s) { for (let i = 0; i < n; i++) shot(x, y, off + i / n * TAU, s); }

function firePlayer() {
  const mk = (dx, a) => pb.push({ x: P.x + dx, y: P.y - 16, vx: Math.sin(a) * 760, vy: -Math.cos(a) * 760, dmg: 1 });
  const p = P.power;
  mk(-5, 0); mk(5, 0);
  if (p >= 2) { mk(-9, -0.12); mk(9, 0.12); }
  if (p >= 3) { mk(0, 0); mk(-12, -0.26); mk(12, 0.26); }
  if (p >= 4) { mk(-14, -0.4); mk(14, 0.4); }
}

/* ---------- boss ---------- */
function spawnBoss() {
  bossCount++;
  const hp = 340 + bossCount * 180;
  boss = { x: W / 2, y: -120, t: 0, hp, maxHp: hp, fireT: 2, phase: 1, spin: 0, burst: 0, hitT: 0, add: 3, dying: 0 };
}
function bossHit(x, y) { const dx = (x - boss.x) / 128, dy = (y - boss.y) / 40; return dx * dx + dy * dy < 1; }
function updBoss(b, dt) {
  b.t += dt; b.hitT = Math.max(0, b.hitT - dt);
  if (b.dying > 0) {
    b.dying -= dt; b.y += 22 * dt;
    if (Math.random() < dt * 14) explode(b.x + (Math.random() - 0.5) * 240, b.y + (Math.random() - 0.5) * 60, 1 + Math.random() * 1.5);
    if (b.dying <= 0) {
      explode(b.x, b.y, 4); flash = 0.7;
      ['P', 'H', 'B'].forEach((k, i) => pu.push({ x: b.x - 50 + i * 50, y: b.y, kind: k, t: i }));
      boss = null;
    }
    return;
  }
  if (b.y < 140) { b.y += 70 * dt; return; }
  b.x = W / 2 + Math.sin((b.t) * 0.5) * 120;
  const r = b.hp / b.maxHp;
  const newPhase = r > 0.66 ? 1 : r > 0.33 ? 2 : 3;
  if (newPhase !== b.phase) { b.phase = newPhase; b.fireT = 1; banner = { text: newPhase === 2 ? '흑운호 선회 사격' : '흑운호 최후 발악', sub: '', t: 1.6, warn: true }; }
  if (P.dead) return;
  b.fireT -= dt;
  if (b.fireT <= 0) {
    const s = 0.9 + bossCount * 0.1;
    if (b.phase === 1) { fan(b.x, b.y + 40, 7, 0.9, 200 * s); fan(b.x - 70, b.y, 3, 0.4, 170 * s); fan(b.x + 70, b.y, 3, 0.4, 170 * s); b.fireT = 1.3; }
    else if (b.phase === 2) {
      b.spin += 0.37; b.burst++;

}

/* ---------- enemies ---------- */
function updEnemy(e, dt) {
  e.t += dt; e.hitT = Math.max(0, e.hitT - dt);
  const canShoot = !P.dead && e.y > 30 && e.y < H * 0.6;
  switch (e.type) {
    case 'scout': {
      if (e.mode === 'arc') {
        const vy = 50 + e.t * 75; e.x += e.vx * dt; e.y += vy * dt; e.ang = Math.atan2(e.vx, -vy);
      } else {
        e.y += (150 + wave * 4) * dt; e.x = e.bx + Math.sin(e.t * 2.6 + e.ph) * e.amp; e.ang = Math.PI;
      }
      if (wave >= 3 && canShoot) { e.fireT -= dt; if (e.fireT <= 0) { e.fireT = 2.5 + Math.random() * 2; aimShot(e, 0); } }
      break;
    }
    case 'gunship': {
      if (e.t < 1.6) e.y += ((e.ty - e.y) * 2.2 + 30) * dt;
      else if (e.t < 9) {
        e.x = e.bx + Math.sin((e.t - 1.6) * 1.1) * 70 * e.dir;
        if (canShoot) {
          e.fireT -= dt;
          if (e.fireT <= 0) { e.fireT = Math.max(0.75, 1.7 - wave * 0.06); aimShot(e, 0); if (wave >= 4) { aimShot(e, 0.22); aimShot(e, -0.22); } }
        }
      } else e.y += 160 * (e.t - 9) * dt + 40 * dt;
      break;
    }
    case 'bomber': {
      e.y += 38 * dt; e.x = e.bx + Math.sin(e.t * 0.6) * 30;
      if (!P.dead && e.y > 40 && e.y < H * 0.7) { e.fireT -= dt; if (e.fireT <= 0) { e.fireT = Math.max(1.4, 2.6 - wave * 0.08); ring(e.x, e.y + 10, 10 + Math.min(6, wave), e.t, 125 + wave * 3); } }
      break;
    }
    case 'kamikaze': {
      if (e.t < 0.9) { e.y += 110 * dt; e.ang = Math.PI; }
      else {
        if (!P.dead) {
          const want = Math.atan2(P.x - e.x, -(P.y - e.y));
          let d = want - e.ang; d = Math.atan2(Math.sin(d), Math.cos(d));
          const tr = (e.t < 3 ? 2.6 : 0.25) * dt;
          e.ang += Math.max(-tr, Math.min(tr, d));
        }
        e.sp = Math.min(250 + wave * 6, e.sp + 420 * dt);
        e.x += Math.sin(e.ang) * e.sp * dt; e.y -= Math.cos(e.ang) * e.sp * dt;
      }
      break;
    }
  }
}
function offscreen(o, m) { return o.x < -m || o.x > W + m || o.y < -m - 200 || o.y > H + m; }

function kill(e) {
  score += e.score;
  popText(e.x, e.y, '+' + e.score);
  explode(e.x, e.y, e.type === 'bomber' ? 2.6 : e.type === 'gunship' ? 1.6 : 1);
  if (Math.random() < e.drop) {
    const r = Math.random();
    const kind = r < (P.power < 4 ? 0.5 : 0.2) ? 'P' : r < 0.75 ? 'H' : 'B';
    pu.push({ x: e.x, y: e.y, kind, t: 0 });

}

function hurt() {
  if (P.inv > 0 || P.dead) return;
  P.hp--; P.inv = 2.2; P.power = Math.max(1, P.power - 1);
  shake = 12; flash = Math.max(flash, 0.25); sfx.hurt();

}

function useBomb() {
  if (state !== 'play' || !P || P.dead || P.bombs <= 0) return;
  P.bombs--; syncBomb();
  eb = []; flash = 1; shake = 16; sfx.bomb();
  fx.push({ k: 'ring', x: P.x, y: P.y, life: 0, max: 0.8, r: 520 });
  for (const e of en) if (e.y > -10) { e.hp -= 40; e.hitT = 0.1; }

}

/* ---------- effects ---------- */
function explode(x, y, size) {

    const a = Math.random() * TAU, s = Math.random() * (60 + size * 70);
    fx.push({ k: 'fire', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0, max: 0.35 + Math.random() * 0.3 * size, r: (3 + Math.random() * 4) * size });
  }
  for (let i = 0; i < size * 3; i++) {
    const a = Math.random() * TAU, s = Math.random() * 40;
    fx.push({ k: 'smoke', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s + 30, life: 0, max: 0.9 + Math.random() * 0.6, r: (5 + Math.random() * 5) * size });
  }
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = 150 + Math.random() * 250;
    fx.push({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0, max: 0.25 + Math.random() * 0.25 });
  }

}
function popText(x, y, s) { fx.push({ k: 'text', x, y, vx: 0, vy: -40, life: 0, max: 0.8, s }); }
function spark(x, y) {
  for (let i = 0; i < 2; i++) { const a = -Math.PI / 2 + (Math.random() - 0.5) * 2; fx.push({ k: 'spark', x, y, vx: Math.cos(a) * 160, vy: Math.sin(a) * 160, life: 0, max: 0.15 }); }
}

/* ---------- background ---------- */
const bg = { scroll: 0, islands: [], clouds: [], dashes: [], islandT: 0, cloudT: 0 };
function makeIsland(y) {

  for (let i = 0; i < n; i++) { const a = i / n * TAU; pts.push([Math.cos(a) * r * (0.65 + Math.random() * 0.45), Math.sin(a) * r * (0.55 + Math.random() * 0.5)]); }

}
function makeCloud(y, high) {

  for (let i = 0; i < n; i++) puffs.push([(Math.random() - 0.5) * 90 * sz, (Math.random() - 0.5) * 24 * sz, (15 + Math.random() * 20) * sz]);

}
for (let i = 0; i < 90; i++) bg.dashes.push([Math.random() * W, Math.random() * H, 6 + Math.random() * 12]);
for (let i = 0; i < 3; i++) bg.islands.push(makeIsland(Math.random() * H));
for (let i = 0; i < 4; i++) bg.clouds.push(makeCloud(Math.random() * H, false));

function scrollBg(dt) {
  bg.scroll += dt * 50;
  for (const d of bg.dashes) { d[1] += dt * 50; if (d[1] > H + 10) { d[1] -= H + 20; d[0] = Math.random() * W; } }
  for (const s of bg.islands) s.y += dt * 50;

}

/* ---------- main update ---------- */
function update(dt) {
  time += dt; scrollBg(dt);
  shake = Math.max(0, shake - dt * 30); flash = Math.max(0, flash - dt * 2.2);
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }

  // player
  if (!P.dead) {
    let mx = (keys.arrowright || keys.d ? 1 : 0) - (keys.arrowleft || keys.a ? 1 : 0);
    let my = (keys.arrowdown || keys.s ? 1 : 0) - (keys.arrowup || keys.w ? 1 : 0);
    if (mx && my) { mx *= 0.707; my *= 0.707; }
    P.x += mx * 320 * dt; P.y += my * 320 * dt; clampPlayer();
    const vx = (P.x - P.px) / Math.max(dt, 0.001); P.px = P.x;
    P.bank += (Math.max(-1, Math.min(1, vx / 320)) - P.bank) * Math.min(1, dt * 8);
    P.inv = Math.max(0, P.inv - dt);
    P.fireT -= dt;
    if (P.fireT <= 0) { firePlayer(); P.fireT = P.power >= 4 ? 0.085 : 0.11; if ((shotTick++ & 1) === 0) sfx.shoot(); }
  } else {
    P.deadT -= dt;
    if (P.deadT <= 0) { gameOver(); return; }
  }

  // spawning
  waveT += dt;
  while (spawnQ.length && spawnQ[0].at <= waveT) spawnQ.shift().fn();
  if (!spawnQ.length && !en.length && !boss && !P.dead) { clearT += dt; if (clearT > 1.6) nextWave(); }

  // entities
  for (const b of pb) { b.x += b.vx * dt; b.y += b.vy * dt; }
  pb = pb.filter(b => b.y > -20 && b.x > -20 && b.x < W + 20);
  for (const b of eb) { b.x += b.vx * dt; b.y += b.vy * dt; }
  eb = eb.filter(b => !offscreen(b, 20));
  for (const e of en) updEnemy(e, dt);
  if (boss) updBoss(boss, dt);
  for (const p of pu) { p.t += dt; p.y += 55 * dt; p.x += Math.sin(p.t * 2.2) * 30 * dt; }
  pu = pu.filter(p => p.y < H + 30);

  // player bullets vs enemies / boss
  for (const b of pb) {
    if (b.dead) continue;
    for (const e of en) {
      if (e.hp <= 0 || e.y < -10) continue;
      const dx = b.x - e.x, dy = b.y - e.y;
      if (dx * dx + dy * dy < (e.r + 3) * (e.r + 3)) { b.dead = true; e.hp -= b.dmg; e.hitT = 0.06; spark(b.x, b.y); break; }
    }
    if (!b.dead && boss && !boss.dying && boss.y > 60 && bossHit(b.x, b.y)) {
      b.dead = true; boss.hp -= b.dmg; boss.hitT = 0.05; spark(b.x, b.y);
      if ((shotTick & 7) === 0) sfx.hit();
    }
  }
  pb = pb.filter(b => !b.dead);
  if (boss && !boss.dying && boss.hp <= 0) {
    boss.hp = 0; boss.dying = 2.2; eb = []; score += 5000 * bossCount; popText(boss.x, boss.y - 30, '+' + (5000 * bossCount));
  }
  for (const e of en) if (e.hp <= 0 && !e.gone) { e.gone = true; kill(e); }
  en = en.filter(e => !e.gone && !(e.t > 2 && offscreen(e, 80)));

  // hits on player
  if (!P.dead) {
    for (const b of eb) {
      const dx = b.x - P.x, dy = b.y - P.y;
      if (dx * dx + dy * dy < (b.r + P.r) * (b.r + P.r)) { b.dead = true; hurt(); break; }
    }
    eb = eb.filter(b => !b.dead);
    for (const e of en) {
      const dx = e.x - P.x, dy = e.y - P.y, rr = e.r * 0.8 + P.r;
      if (dx * dx + dy * dy < rr * rr) {
        if (P.inv <= 0) { e.hp -= e.type === 'kamikaze' ? 99 : 12; hurt(); }
        if (e.hp <= 0 && !e.gone) { e.gone = true; kill(e); }
      }
    }
    en = en.filter(e => !e.gone);
    if (boss && !boss.dying && bossHit(P.x, P.y + 8)) hurt();
    for (const p of pu) {
      if (Math.hypot(p.x - P.x, p.y - P.y) < 26) { p.taken = true; collect(p); }
    }
    pu = pu.filter(p => !p.taken);
  }

  updFx(dt);
}
function collect(p) {
  sfx.power();
  if (p.kind === 'P') { if (P.power < 4) { P.power++; popText(p.x, p.y, '화력 ' + P.power); } else bonus(p); }
  if (p.kind === 'H') { if (P.hp < P.maxHp) { P.hp++; popText(p.x, p.y, '수리'); } else bonus(p); }
  if (p.kind === 'B') { if (P.bombs < 5) { P.bombs++; syncBomb(); popText(p.x, p.y, '폭탄 +1'); } else bonus(p); }
}
function bonus(p) { score += 1000; popText(p.x, p.y, '+1000'); }
function clampPlayer() { P.x = Math.max(20, Math.min(W - 20, P.x)); P.y = Math.max(90, Math.min(H - 40, P.y)); }

}

    ctx.fillStyle = `rgba(255,240,228,${a})`;
    for (const [dx, dy, r] of c.puffs) { ctx.beginPath(); ctx.arc(c.x + dx - 2, c.y + dy - 2, r * 0.9, 0, TAU); ctx.fill(); }
  }
}

const PU_COL = { P: '#f5c45e', H: '#6fd0a8', B: '#f08a5d' };
function draw() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.save();
  if (shake > 0 && !reduceMotion) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawSea();

  // shadows on the sea
  for (const e of en) plane(e.x + 16, e.y + 26, e.ang, SCALE[e.type] * 0.85, LOOK[e.type], { shadow: true });
  if (boss) drawBoss(boss, true);
  if (P && !P.dead) plane(P.x + 18, P.y + 30, 0, 0.85, LOOK.player, { shadow: true, bank: P.bank });

  drawClouds(false);

  for (const p of pu) {
    const pulse = 1 + Math.sin(p.t * 6) * 0.08;
    ctx.fillStyle = 'rgba(18,13,34,.55)'; ctx.beginPath(); ctx.arc(p.x, p.y, 14 * pulse, 0, TAU); ctx.fill();
    ctx.strokeStyle = PU_COL[p.kind]; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(p.x, p.y, 12 * pulse, 0, TAU); ctx.stroke();
    ctx.fillStyle = PU_COL[p.kind]; ctx.font = '700 14px "Chakra Petch", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.kind, p.x, p.y + 1);
  }

  for (const e of en) plane(e.x, e.y, e.ang, SCALE[e.type], LOOK[e.type], { hit: e.hitT > 0 });
  if (boss) drawBoss(boss, false);

  // player tracers
  ctx.fillStyle = 'rgba(245,196,94,.35)';
  for (const b of pb) ctx.fillRect(b.x - 2.5, b.y - 8, 5, 16);
  ctx.fillStyle = '#fff0c2';
  for (const b of pb) ctx.fillRect(b.x - 1, b.y - 7, 2, 14);

  if (P && !P.dead && !(P.inv > 0 && Math.floor(time * 18) % 2)) {
    plane(P.x, P.y, 0, 1, LOOK.player, { bank: P.bank });
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(P.x, P.y + 1, 2.2, 0, TAU); ctx.fill();
  }

  // enemy bullets
  ctx.fillStyle = 'rgba(255,110,90,.28)'; ctx.beginPath();
  for (const b of eb) { ctx.moveTo(b.x + b.r + 4, b.y); ctx.arc(b.x, b.y, b.r + 4, 0, TAU); } ctx.fill();
  ctx.fillStyle = '#ffe2c8'; ctx.beginPath();
  for (const b of eb) { ctx.moveTo(b.x + b.r, b.y); ctx.arc(b.x, b.y, b.r, 0, TAU); } ctx.fill();
  ctx.fillStyle = '#e0414f'; ctx.beginPath();
  for (const b of eb) { ctx.moveTo(b.x + b.r - 2, b.y); ctx.arc(b.x, b.y, b.r - 2, 0, TAU); } ctx.fill();

  drawFx();
  drawClouds(true);
  ctx.fillStyle = duskGrad; ctx.fillRect(-30, -30, W + 60, H + 60);
  ctx.restore();

  if (flash > 0) { ctx.fillStyle = `rgba(255,238,220,${Math.min(0.85, flash * 0.8)})`; ctx.fillRect(0, 0, W, H); }
  if (state !== 'title' && P) drawHUD();
  if (banner && state === 'play') drawBanner();
}

function drawFx() {
  for (const f of fx) {
    const t = f.life / f.max, a = 1 - t;
    if (f.k === 'smoke') { ctx.fillStyle = `rgba(42,36,58,${a * 0.45})`; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1 + t * 1.4), 0, TAU); ctx.fill(); }
  }
  for (const f of fx) {
    const t = f.life / f.max, a = 1 - t;
    if (f.k === 'fire') {
      ctx.fillStyle = t < 0.25 ? `rgba(255,244,205,${a})` : t < 0.6 ? `rgba(245,160,74,${a})` : `rgba(194,70,58,${a})`;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.6 + t), 0, TAU); ctx.fill();
    } else if (f.k === 'spark') {
      ctx.strokeStyle = `rgba(255,227,154,${a})`; ctx.lineWidth = 1.5; ctx.beginPath();
      ctx.moveTo(f.x, f.y); ctx.lineTo(f.x - f.vx * 0.03, f.y - f.vy * 0.03); ctx.stroke();
    } else if (f.k === 'ring') {
      ctx.strokeStyle = `rgba(255,232,200,${a * 0.8})`; ctx.lineWidth = 3 * a + 0.5;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * Math.sqrt(t), 0, TAU); ctx.stroke();
    } else if (f.k === 'text') {
      ctx.fillStyle = `rgba(246,234,215,${a})`; ctx.font = '700 13px "Chakra Petch", "IBM Plex Sans KR", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(f.s, f.x, f.y);
    }
  }
}

function drawHUD() {
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(18,13,34,.5)'; ctx.fillRect(0, 0, W, 42);
  ctx.font = '600 10px "IBM Plex Sans KR", sans-serif'; ctx.fillStyle = '#b9adc8';
  ctx.textAlign = 'left'; ctx.fillText('점수', 14, 15);
  ctx.textAlign = 'right'; ctx.fillText('최고', W - 14, 15);
  ctx.textAlign = 'center'; ctx.fillText('편대 진행', W / 2, 15);
  ctx.font = '700 19px "Chakra Petch", monospace'; ctx.fillStyle = '#f6ead7';
  ctx.textAlign = 'left'; ctx.fillText(String(score).padStart(7, '0'), 14, 35);
  ctx.textAlign = 'right'; ctx.fillStyle = '#f5c45e'; ctx.fillText(String(Math.max(hi, score)).padStart(7, '0'), W - 14, 35);
  ctx.textAlign = 'center'; ctx.fillStyle = '#f6ead7'; ctx.fillText(`제 ${wave} 파`, W / 2, 35);

  // hull + firepower, bottom left
  const by = H - 22;
  ctx.font = '600 10px "IBM Plex Sans KR", sans-serif'; ctx.fillStyle = '#b9adc8'; ctx.textAlign = 'left';
  ctx.fillText('기체', 14, by - 22); ctx.fillText('화력', 104, by - 22);
  for (let i = 0; i < P.maxHp; i++) {
    ctx.fillStyle = i < P.hp ? '#6fd0a8' : 'rgba(246,234,215,.18)';
    ctx.beginPath(); ctx.moveTo(14 + i * 15, by); ctx.lineTo(20 + i * 15, by - 12); ctx.lineTo(26 + i * 15, by); ctx.closePath(); ctx.fill();
  }
  for (let i = 0; i < 4; i++) { ctx.fillStyle = i < P.power ? '#f5c45e' : 'rgba(246,234,215,.18)'; ctx.fillRect(104 + i * 11, by - 12, 7, 12); }

  if (boss && boss.y > 0) {
    const bw = 300, bx = (W - bw) / 2, yy = 54;
    ctx.fillStyle = 'rgba(18,13,34,.6)'; ctx.fillRect(bx - 2, yy - 2, bw + 4, 10);
    ctx.fillStyle = '#f08a5d'; ctx.fillRect(bx, yy, bw * Math.max(0, boss.hp / boss.maxHp), 6);
    ctx.fillStyle = '#f6ead7'; ctx.font = '600 10px "IBM Plex Sans KR", sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(`적 기함 흑운호 ${bossCount}호기`, W / 2, yy + 22);
  }
}

function drawBanner() {
  const b = banner, a = Math.min(1, b.t * 2, (3.4 - b.t) * 3);
  ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, a));
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = b.warn ? 'rgba(120,30,40,.55)' : 'rgba(18,13,34,.45)';
  ctx.fillRect(0, H * 0.38 - 44, W, b.sub ? 92 : 70);
  ctx.font = '40px "Black Han Sans", "IBM Plex Sans KR", sans-serif';
  ctx.fillStyle = b.warn ? '#ffd3bf' : '#f6ead7';
  ctx.fillText(b.text, W / 2, H * 0.38 - 8);
  if (b.sub) { ctx.font = '600 14px "IBM Plex Sans KR", sans-serif'; ctx.fillStyle = '#f5c45e'; ctx.fillText(b.sub, W / 2, H * 0.38 + 28); }
  ctx.restore();
}

/* ---------- loop ---------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (state === 'play') update(dt);
  else if (state !== 'pause') ambient(dt);
  draw();
  requestAnimationFrame(loop);
}

function boot(data) {
  if (data && data.hi > hi) hi = data.hi;
  showPanel('title');
  requestAnimationFrame(t => { last = t; loop(t); });
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ hi }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>

</body>
</html>
